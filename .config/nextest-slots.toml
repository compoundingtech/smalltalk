# Loaded only by scripts/ci-nextest (nextest --tool-config-file), never by a bare `cargo nextest run`.
#
# scripts/ci-nextest multiplies the caller's --test-threads N by SLOT_RATIO (3) and this file makes
# every test that is not wait-bound take SLOT_RATIO slots. N CPU-sized tests run at once, as before,
# while the tests that mostly sleep or poll (they start real daemons and wait on sockets, timers and
# the outage windows) take one slot each, so sixteen waiting tests never keep a CPU-bound test from
# starting and their waits overlap. No test, filter, retry or timeout changes.
# scripts/ci-nextest-slots-test keeps the ratio and the module list in step with the script.
[[profile.ci.overrides]]
filter = 'not (package(=st3) and binary(=integration) and test(/^(messaging_faults|boot_canaries|fleet|daemon_restart|codex_bootstrap|delivery_probe|subagents_seat|idle_budget|client_only)::/))'
threads-required = 3
