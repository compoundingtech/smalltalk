# Start the parallel fault cases early so the two-minute outage and retries fit the CI window.
[[profile.default.overrides]]
filter = 'package(st3) and test(/^messaging_faults::/)'
priority = 100

[profile.ci]
# Owned quarantine: merge-queue-flakes runs link_minutes once in optional perf-cost.
# Its full 10-second/native/authentication oracle stays unchanged while the signed
# exchange retry-cap mismatch is repaired; every other messaging fault stays required.
test-threads = 8
fail-fast = false
retries = { count = 2, backoff = "fixed", delay = "30s", jitter = false }
status-level = "fail"
final-status-level = "flaky"
# The gate covers st3, st-runtime, st-drivers and the other shared crates, and the st2 test
# files. It leaves out st2-only code: st2's own unit tests (none of its remaining modules is
# used by st3), its catalog, eval-run, resync, nomad-survival, event and resource-profile
# supervisor tests, and st-drivers' catalog, resync and resource-profile supervisor modules.
# `transport_isolation` needs real systemd user scopes; the isolation-vm job runs it in a
# NixOS VM. The cost check and the load test (`daemon_cost`, `daemon_load`) run in their own
# perf jobs, so they never lengthen this one (scripts/ci-perf). See docs/ci.md.
# The outbound-only real-network timing check also runs once in perf-cost. Its strict
# convergence and redundant-connection windows stay separate from required deterministic
# backoff and inbound/route interruption controls.
# scripts/ci-nextest also omits entirely excluded st2 targets from Cargo's build selection;
# keep its retained target list in sync when changing the binary-level exclusions below.
default-filter = '''
not (
  (package(=st3) and test(/^messaging_faults::link_minutes$/))
  or (package(=st2) and (
    kind(lib) or kind(bin)
    or binary(=event_e2e) or binary(=resource_profile_supervisor_e2e)
    or test(/^(catalog_[^:]*|eval_run_e2e|nomad_survival|resync[^:]*|supervisor_auto_archive|transport_isolation)::/)
  ))
  or (package(=st-drivers) and kind(lib)
    and test(/^(catalog[^:]*|resync|resource_profile_supervisor)::/))
  or (package(=st3) and test(/^daemon_(cost|load)::/))
  or (package(=smallclaims) and test(/^sync::worker::tests::retry_tests::isolated_outbound_only_node_converges_after_two_minutes_and_four_hours$/))
)
'''

# The fleet reconnect test also includes a real two-minute outage. The ci profile inherits the
# default profile's messaging-fault priority above.
[[profile.ci.overrides]]
filter = 'package(st3) and test(/^fleet::outbound_only_member_returns_after_minutes_and_aged_hours_without_alerts$/)'
priority = 100

# A boot canary's race or a fresh-seat boundary violation must not disappear behind a retry.
# Start these early too: five seats launch together in one case.
[[profile.ci.overrides]]
filter = 'package(st3) and (test(/^boot_canaries::/) or test(/^no_st2_seat::/) or test(/^codex_bootstrap::delayed_delivery_control_holds_visible_native_input_and_recovers_once$/))'
retries = 0
priority = 100

# Product action admission and restart races must fail visibly, rather than pass on retry.
[[profile.ci.overrides]]
filter = 'package(st3) and (test(/^action_coverage::/) or test(/^fleet::action_coverage_/))'
retries = 0

# Keep both measured control intervals visible even when the idle positive passes.
# A CPU regression or a broken busy negative must remain a failure without retry.
[[profile.ci.overrides]]
filter = 'package(st3) and test(/^idle_budget::a_quiescent_daemon_cpu_control_accepts_idle_and_rejects_busy$/)'
success-output = "immediate"
retries = 0

# Retain the measured whole-page tuple on success as well as failure.
# This changes output visibility only; inherited retries and all work ceilings remain.
[[profile.ci.overrides]]
filter = 'package(=smallclaims) and binary(=ivm_admitted_applied_slice) and test(/^full_page_accounting_includes_metadata_and_physical_reader_writer_return$/)'
success-output = "immediate"

# Retain actual inventory-growth tuples; this is diagnostic visibility only.
# Selection, retries, threads, ceilings and the strict override remain unchanged.
[[profile.ci.overrides]]
filter = 'package(=smallclaims) and binary(=ivm_admitted_applied_slice) and test(/^canonical_metadata_inventory_growth_reports_actual_page_work$/)'
success-output = "immediate"

# Expose private native-source work tuples without changing selection or budgets.
[[profile.ci.overrides]]
filter = 'package(=st3) and test(/^store::terminal_gate_evidence::native_source::tests::native_gate_unrelated_and_noop_work_at_zero_1024_and_100000_rows$/)'
success-output = "immediate"
