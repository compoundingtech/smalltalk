priority = 100

# Start the longest tests first. The partition logs of 2026-10-16 (#3133 and #3137, two shards
# each, 8 threads) show tests of 100 to 260 seconds starting 270 to 680 seconds into a 700 to 760
# second run, so the last 30 to 90 seconds ran one or two tests on an otherwise idle machine.
# These are the tests of 75 seconds or more that had no priority (the messaging, boot and fleet
# tests above already do). Order only: no selection, retry, thread or assertion change.
[[profile.default.overrides]]
filter = '''
((package(=fractal) or package(=fractal-daemon) or package(=fractal-api-client-v0) or package(=fractal-api-mailbox) or package(=fractal-attention) or package(=fractal-delivery) or package(=fractal-missions) or package(=fractal-seats) or package(=fractal-evidence) or package(=fractal-github) or package(=fractal-seats-base) or package(=fractal-delivery-base) or package(=fractal-missions-base) or package(=fractal-github-base) or package(=fractal-secrets) or package(=fractal-api-core) or package(=fractal-reconcile) or package(=fractal-peer) or package(=fractal-store)) and (
    test(/^convergence::(seed_1_converges_on_a_real_disk|the_checks_catch_a_partial_adoption)$/)
    or test(/^delivery_probe::native_delivery_probe_alerts_and_recovers_without_model_turns$/)
    or test(/^client_only::the_(fleet|usage)_inventory_screen_sends_no_request_after_its_first_frames_for_more_than_a_minute$/)
