    or test(/^subagents_seat::a_seats_subagents_appear_renew_and_end$/)
    or test(/^revision_seats::isolated_revision_preserves_completed_builder_declarations_and_cleanup$/)
    or test(/^store::reconcile_work_context::tests::batched_work_/)
    or test(/^store::tests::mailbox_fence_tests::mailbox_fence_cost_is_bounded_with_sparse_observation_history$/)
    or test(/^api::client_v0::tests::runtime_roster_fixed_page_cost_ignores_subject_history$/)
  ))
  or (binary(=checkpoint_memory) and test(/^a_checkpoint_pass_holds_a_fixed_budget_whatever_the_history$/))
'''
priority = 100

[profile.ci]
# Owned quarantine: merge-queue-flakes runs link_minutes once in optional perf-cost.
# Its full 10-second/native/authentication oracle stays unchanged while the signed
# exchange retry-cap mismatch is repaired; every other messaging fault stays required.
test-threads = 8
fail-fast = false
retries = { count = 2, backoff = "fixed", delay = "30s", jitter = false }
status-level = "fail"
final-status-level = "flaky"
# The gate covers st3, st-runtime, st-drivers and the other shared crates, and the st2 test
# files. It leaves out st2-only code: st2's own unit tests (none of its remaining modules is
# used by st3), its catalog, eval-run, resync, nomad-survival, event and resource-profile
# supervisor tests, and st-drivers' catalog, resync and resource-profile supervisor modules.
# `transport_isolation` needs real systemd user scopes; the daily isolation-vm lane runs it in a
# NixOS VM. The cost check and the load test (`daemon_cost`, `daemon_load`) run in their own
# perf jobs (scripts/ci-perf). Only the in-memory targets-file linkage unit and the cost
# check's route coverage and route-inventory units also run here: they start no daemon or load,
# and a new route without a cost probe then fails in its own pull request. See docs/ci.md.
# The outbound-only real-network timing check also runs once in perf-cost. Its strict
# convergence and redundant-connection windows stay separate from required deterministic
# backoff and inbound/route interruption controls.
# scripts/ci-nextest preserves the retained binary selection in one workspace invocation.
# Its filters control execution; Cargo still compiles excluded workspace test targets.
default-filter = '''
not (
  ((package(=fractal) or package(=fractal-daemon) or package(=fractal-api-client-v0) or package(=fractal-api-mailbox) or package(=fractal-attention) or package(=fractal-delivery) or package(=fractal-missions) or package(=fractal-seats) or package(=fractal-evidence) or package(=fractal-github) or package(=fractal-seats-base) or package(=fractal-delivery-base) or package(=fractal-missions-base) or package(=fractal-github-base) or package(=fractal-secrets) or package(=fractal-api-core) or package(=fractal-reconcile) or package(=fractal-peer) or package(=fractal-store)) and test(/^messaging_faults::link_minutes$/))
  or (package(=fractal-legacy-runner) and (
    kind(lib) or kind(bin)
    or binary(=event_e2e) or binary(=resource_profile_supervisor_e2e)
    or test(/^(catalog_[^:]*|eval_run_e2e|nomad_survival|resync[^:]*|supervisor_auto_archive|transport_isolation)::/)
  ))
  or (package(=fractal-drivers) and kind(lib)
    and test(/^(catalog[^:]*|resync|resource_profile_supervisor)::/))
  or ((package(=fractal) or package(=fractal-daemon) or package(=fractal-api-client-v0) or package(=fractal-api-mailbox) or package(=fractal-attention) or package(=fractal-delivery) or package(=fractal-missions) or package(=fractal-seats) or package(=fractal-evidence) or package(=fractal-github) or package(=fractal-seats-base) or package(=fractal-delivery-base) or package(=fractal-missions-base) or package(=fractal-github-base) or package(=fractal-secrets) or package(=fractal-api-core) or package(=fractal-reconcile) or package(=fractal-peer) or package(=fractal-store)) and test(/^daemon_(cost|load)::/)
    and not test(=daemon_load::targets_come_from_the_targets_file_and_describe_without_gating)
    and not test(=daemon_cost::the_cost_check_covers_every_route)
    and not test(/^daemon_cost::the_cost_route_inventory_/))
  or (package(=smallclaims) and test(/^sync::worker::tests::retry_tests::isolated_outbound_only_node_converges_after_two_minutes_and_four_hours$/))
)
'''

