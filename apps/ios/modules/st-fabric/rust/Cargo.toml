[package]
name = "st-fabric-bridge"
version = "0.1.0"
edition = "2024"
publish = false

# Deliberately isolated from the daemon workspace and its native dependencies.
[workspace]

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
anyhow = "1"
iroh = "=1.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = "debuginfo"

[patch.crates-io]
# netdev 0.46.3 incorrectly compiles a macOS-only libc ioctl type on iOS.
netdev = { path = "vendor/netdev" }
netwatch = { path = "vendor/netwatch" }
