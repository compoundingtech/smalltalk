name: Nix
on:
  pull_request:
  push:
    tags: ['**']

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-x86_64-linux:
    # st/ci checks same-repository PRs and main on our own Linux host.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # rust-cache discovers the compiler and Cargo metadata inside the flake's
      # dev shell. The stable key lets PRs restore the cache seeded by main.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace-debug
          cmd-format: nix develop -c {0}
          cache-on-failure: true
      # The provider component integration tests require Wasm artifacts supplied
      # by the tag-only Nix check; its library tests still run here.
      # Some st2 tests verify rendered hooks from the built binary. Install the
      # matching set before nextest gives each test a separate process.
      - run: nix develop --command cargo run --locked -p st2 -- hooks install
      - run: nix develop --command cargo nextest run --workspace --exclude st2-resource-providers --locked --no-fail-fast --test-threads 4
      - run: nix develop --command cargo nextest run -p st2-resource-providers --lib --locked --no-fail-fast --test-threads 4
      - run: nix develop --command cargo clippy --workspace --all-targets --locked

  # The full Nix release/check graph is useful for tags, but compiling it on
  # every PR multiplied cold dependency builds and occupied hosted runners.
  nix-release-x86_64-linux:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/determinate-nix-action@v3
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - run: >-
          nix build --no-link --print-build-logs
          .#packages.x86_64-linux.default
          .#checks.x86_64-linux.st2
          .#checks.x86_64-linux.st3
          .#checks.x86_64-linux.debug-assertions
          .#checks.x86_64-linux.help
          .#checks.x86_64-linux.completions
          .#checks.x86_64-linux.hooks-replacement
          .#checks.x86_64-linux.st3-hook-build-stamp
          .#checks.x86_64-linux.pty-fleet-contract
          .#checks.x86_64-linux.st3-help
          .#checks.x86_64-linux.install-layout
          .#checks.x86_64-linux.st2-install-layout
          .#checks.x86_64-linux.provider-components
          .#checks.x86_64-linux.wasip2-resource-providers
          .#checks.x86_64-linux.release-integration
          .#checks.x86_64-linux.pi-extension-types
          .#checks.x86_64-linux.wasm-resolver-feature
          .#checks.x86_64-linux.wasm-resolver-artifact
