          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          python3 ../scripts/release-smalltalk-manifest.py "$SOURCE_SHA"
          cp ../docs/st3/binary-releases.md RELEASE-NOTES.md
          printf '\nExact source: `%s`. See RELEASE.json for the PTY revision and targets.\n' "$SOURCE_SHA" >> RELEASE-NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: smalltalk-release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_REASON: Downloads verified build artifacts; builds nothing.
        run: "printf 'Cache coverage: **not applicable** — %s\\n' \"$CACHE_REASON\" >> \"$GITHUB_STEP_SUMMARY\""
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (success()) }}
  publishEdge:
    name: release-publish-edge
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: smalltalk-edge-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
      RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: smalltalk-release
          path: dist
      - name: Move the rolling edge pre-release to this verified commit
        run: scripts/release-smalltalk-edge --source "$SOURCE_SHA" --dist dist --run-url "$RUN_URL"
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_REASON: Moves the rolling edge pre-release to a verified main commit; builds nothing.
        run: "printf 'Cache coverage: **not applicable** — %s\\n' \"$CACHE_REASON\" >> \"$GITHUB_STEP_SUMMARY\""
  publish:
    name: release-publish
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.event.deleted == false) }}
    needs: assemble
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: smalltalk-release
          path: dist
      - name: Publish the verified tag artifacts
        run: |
          set -euo pipefail
          git fetch origin "refs/tags/$TAG"
          test "$(git rev-parse 'FETCH_HEAD^{commit}')" = "$SOURCE_SHA"
          python3 scripts/release_notes.py --source "$SOURCE_SHA" --tag "$TAG" --output dist/RELEASE-NOTES.md --manifest dist/UPGRADE-IMPACT.json
          cd dist
          sha256sum --check SHA256SUMS
          python3 ../scripts/release-smalltalk-manifest.py "$SOURCE_SHA"
          # Refuse to replace any existing release or its assets. A partial draft stays private
          # for inspection; delete that draft before retrying, never move the tag.
          gh release create "$TAG" --verify-tag --draft --title "Smalltalk $TAG" \
            --notes-file RELEASE-NOTES.md ./*.tar.gz ./*.sha256 SHA256SUMS RELEASE.json UPGRADE-IMPACT.json
          gh release edit "$TAG" --draft=false

      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_REASON: Publishes verified assembled artifacts; builds nothing.
        run: "printf 'Cache coverage: **not applicable** — %s\\n' \"$CACHE_REASON\" >> \"$GITHUB_STEP_SUMMARY\""
