  isolation-vm:
    name: isolation-vm
    needs: [pick-runner]
    if: ${{ !cancelled() }}
    runs-on: ["namespace-profile-linux-x86-64;job.priority=1;github.run-id=${{ github.run_id }}"]
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CI_CACHE_DEV_SHELL: default
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Probe KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is missing: this runner profile offers no nested virtualization"
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then sudo chmod 0666 /dev/kvm; fi
          python3 - <<'EOF'
          import fcntl, os
          fd = os.open("/dev/kvm", os.O_RDWR | os.O_CLOEXEC)
          version = fcntl.ioctl(fd, 0xAE00)  # KVM_GET_API_VERSION
          vm = fcntl.ioctl(fd, 0xAE01, 0)  # KVM_CREATE_VM
          assert version == 12, f"unexpected KVM API version {version}"
          os.close(vm)
          print(f"KVM API {version}: created a VM")
          EOF
          printf 'KVM: \x60%s\x60, CPU virtualization flag %s, VM creation succeeded\n\n| Phase | Elapsed |\n| --- | --- |\n' "$(ls -l /dev/kvm)" "$(grep -m1 -oE 'vmx|svm' /proc/cpuinfo || echo none)" >> "$GITHUB_STEP_SUMMARY"
      - name: Use the runner's own caches
        run: |
          if [ -n "${CI_LOCAL_CARGO_HOME:-}" ]; then echo CI_LOCAL_CACHES=1 >> "$GITHUB_ENV"; fi
          printf 'CARGO_HOME=%s\nCI_CACHE_DIR=%s\n' "${CI_LOCAL_CARGO_HOME:-$RUNNER_TEMP/cargo-home}" "$RUNNER_TEMP/st-ci-cache" >> "$GITHUB_ENV"
      - id: build-snapshot
        name: Restore the exact-source build snapshot
        if: env.CI_LOCAL_CACHES != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SNAPSHOT_PIPELINE: ${{ github.workflow_sha }}
        run: 'python3 "${CI_BUILD_SNAPSHOT_SCRIPT:-scripts/ci-build-snapshot}" restore'
      - name: Restore the Cargo target and registry
        id: cargo-cache
        if: env.CI_LOCAL_CACHES != '1' && env.CI_BUILD_SNAPSHOT_HIT != '1'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/target
            ${{ runner.temp }}/cargo-home/registry
            ${{ runner.temp }}/cargo-home/git
          key: "cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '.cargo/config.toml') }}"
          restore-keys: "cargo-${{ github.job }}-${{ runner.os }}-"
      - name: Restore the local Nix cache
        id: nix-cache
        if: env.CI_LOCAL_CACHES != '1' && env.CI_BUILD_SNAPSHOT_HIT != '1'
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.temp }}/st-ci-cache"
          key: "nix5-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix', '.github/fleet-compat-baseline.json', '.github/messaging-compat-baseline.json') }}"
          restore-keys: |
            nix5-${{ github.job }}-${{ runner.os }}-
            nix4-${{ github.job }}-${{ runner.os }}-
      - name: Remember genuine source inputs before compiling
        run: 'python3 "${CI_BUILD_SNAPSHOT_SCRIPT:-scripts/ci-build-snapshot}" prepare'
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://overeng-effect-utils.cachix.org
            extra-trusted-public-keys = overeng-effect-utils.cachix.org-1:KFmqYNF6Q7ZzVYPl2znpJYZGEolage9YNCA9res6vKc=
            access-tokens = github.com=${{ github.token }}
          summarize: true
      - name: Isolate test home and XDG state
        run: |
          # Cargo's home and the CI cache directory live under RUNNER_TEMP, not HOME: tests get an isolated HOME,
          # and actions/cache expands a leading tilde against the HOME of the step that runs it.
          printf 'CARGO_HOME=%s\nCI_CACHE_DIR=%s\n' "${CI_LOCAL_CARGO_HOME:-$RUNNER_TEMP/cargo-home}" "$RUNNER_TEMP/st-ci-cache" >> "$GITHUB_ENV"
          home="$RUNNER_TEMP/test-home"
          mkdir -p "$home" "$home/.config" "$home/.cache" "$home/.local/state"
          printf 'HOME=%s\nXDG_CONFIG_HOME=%s/.config\nXDG_CACHE_HOME=%s/.cache\nXDG_STATE_HOME=%s/.local/state\n' "$home" "$home" "$home" "$home" >> "$GITHUB_ENV"
      - name: Use the cached Nix outputs
        if: env.CI_LOCAL_CACHES != '1'
        run: 'bash scripts/ci-nix-cache use || echo "::warning::the local Nix cache is unavailable; this run builds everything"'
      - name: Archive the st2 integration test binary
        run: |
          start=$SECONDS
          nix develop -c cargo nextest archive --locked -p st2 --test integration --archive-file "$RUNNER_TEMP/isolation.tar.zst"
          printf '| test archive build | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the NixOS VM test driver
        run: |
          start=$SECONDS
          nix build --print-build-logs --out-link "$RUNNER_TEMP/vm-driver" .#legacyPackages.x86_64-linux.transport-isolation-vm.driver
          printf '| VM driver build | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"
      - name: Run all three systemd-scope tests in the VM
        env:
          ST_ISOLATION_ARCHIVE: "${{ runner.temp }}/isolation.tar.zst"
          ST_ISOLATION_WORKSPACE: ${{ github.workspace }}
          ST_ISOLATION_TIMINGS: "${{ runner.temp }}/vm-timings.json"
        run: |
          start=$SECONDS
          mkdir -p "$RUNNER_TEMP/vm-out"
          "$RUNNER_TEMP/vm-driver/bin/nixos-test-driver" --output_directory "$RUNNER_TEMP/vm-out"
          jq -r '"| VM boot | \(.boot_seconds)s |\n| systemd-scope tests in VM (extract and run) | \(.test_seconds)s |"' "$ST_ISOLATION_TIMINGS" >> "$GITHUB_STEP_SUMMARY"
          printf '| VM test driver total | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the st binary for the sekrets VM
        run: |
          start=$SECONDS
          nix develop -c cargo build --locked -p st3 --bin st3
          printf '| st build | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the sekrets VM test driver
        run: |
          start=$SECONDS
          nix build --print-build-logs --out-link "$RUNNER_TEMP/sekrets-vm-driver" .#legacyPackages.x86_64-linux.sekrets-vm.driver
          printf '| sekrets VM driver build | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"
      - name: Run the sekrets gateway test in the VM
        env:
          ST_SEKRETS_BINARY: "${{ github.workspace }}/target/debug/st3"
        run: |
          start=$SECONDS
          mkdir -p "$RUNNER_TEMP/sekrets-vm-out"
          "$RUNNER_TEMP/sekrets-vm-driver/bin/nixos-test-driver" --output_directory "$RUNNER_TEMP/sekrets-vm-out"
          printf '| sekrets VM test | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"
      - name: Save Nix outputs
        if: success() && env.CI_LOCAL_CACHES != '1'
        run: bash scripts/ci-nix-cache save
      - id: build-snapshot-save
        name: Keep valid same-source build outputs
        if: "!cancelled()"
        env:
          CI_SNAPSHOT_PIPELINE: ${{ github.workflow_sha }}
        run: 'python3 "${CI_BUILD_SNAPSHOT_SCRIPT:-scripts/ci-build-snapshot}" pack'
      - id: build-snapshot-upload
        name: Retain the same-source build snapshot
        if: "!cancelled() && steps.build-snapshot-save.outputs.publish == 'true'"
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-snapshot-save.outputs.name }}
          path: "${{ runner.temp }}/ci-build-snapshot/build.tar.zst"
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          overwrite: true
      - name: Wait before retrying build snapshot retention
        if: "!cancelled() && steps.build-snapshot-upload.outcome == 'failure'"
        timeout-minutes: 1
        shell: bash
        run: 'echo "::warning::Build snapshot upload failed; retrying once in 15 seconds."; sleep 15'
      - name: Retry retaining the same-source build snapshot
        if: "!cancelled() && steps.build-snapshot-upload.outcome == 'failure'"
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-snapshot-save.outputs.name }}
          path: "${{ runner.temp }}/ci-build-snapshot/build.tar.zst"
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          overwrite: true
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_ENTRIES: '[{"name":"Restore the exact-source build snapshot","outcome":"${{ steps.build-snapshot.outcome }}","hit":"${{ steps.build-snapshot.outputs.cache-hit }}","matched":"","opaqueFallback":true,"sourceOnly":true,"avoidable":"${{ steps.build-snapshot.outputs.avoidable-miss }}","lookup":false},{"name":"Restore the Cargo target and registry","outcome":"${{ steps.cargo-cache.outcome }}","hit":"${{ steps.cargo-cache.outputs.cache-hit }}","matched":"${{ steps.cargo-cache.outputs.cache-matched-key }}","opaqueFallback":false,"sourceOnly":false,"avoidable":"","lookup":false},{"name":"Restore the local Nix cache","outcome":"${{ steps.nix-cache.outcome }}","hit":"${{ steps.nix-cache.outputs.cache-hit }}","matched":"${{ steps.nix-cache.outputs.cache-matched-key }}","opaqueFallback":false,"sourceOnly":false,"avoidable":"","lookup":false}]'
        run: 'python3 "${CI_CACHE_AUDIT_SCRIPT:-scripts/ci-cache-audit}"'
