          printf 'ST3_MESSAGING_COMPAT_BIN=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Prepare provider component fixtures
        run: |
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          components=$(nix build ".#checks.$system.provider-components" --no-link --print-out-paths --print-build-logs)
          for provider in GITHUB_ISSUE GITHUB_PR PTY_STATS VISTA; do
            wasm=$(printf '%s' "$provider" | tr '[:upper:]' '[:lower:]')
            printf 'ST2_%s_COMPONENT=%s/share/st2/providers/st2_%s_component.component.wasm\n' "$provider" "$components" "$wasm" >> "$GITHUB_ENV"
          done
        if: "!(needs.evidence-gate-isolation-vm.outputs.skip == 'true')"
      - name: Download this run attempt’s successful test build
        env:
          GH_TOKEN: ${{ github.token }}
          CI_TEST_ARCHIVE_ARTIFACT_ID: ${{ needs.linux-test-build.outputs.artifact-id }}
          CI_TEST_ARCHIVE_MANIFEST_SHA256: ${{ needs.linux-test-build.outputs.manifest-sha256 }}
          CI_TEST_ARCHIVE_PRODUCER_ATTEMPT: ${{ needs.linux-test-build.outputs.producer-attempt }}
        run: python3 scripts/ci-test-archive download
        if: "!(needs.evidence-gate-isolation-vm.outputs.skip == 'true')"
      - name: Verify source, hashes and extract test archives
        shell: bash
        run: nix develop -c python3 scripts/ci-test-archive consume
        env:
          CI_TEST_ARCHIVE_MANIFEST_SHA256: ${{ needs.linux-test-build.outputs.manifest-sha256 }}
          CI_TEST_ARCHIVE_PRODUCER_ATTEMPT: ${{ needs.linux-test-build.outputs.producer-attempt }}
        if: "!(needs.evidence-gate-isolation-vm.outputs.skip == 'true')"
      - name: Install matching rendered hooks
        shell: bash
        run: nix develop -c bash scripts/ci-install-built-hooks
        if: "!(needs.evidence-gate-isolation-vm.outputs.skip == 'true')"
      - name: Probe KVM
        id: kvm
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is missing: this runner profile offers no nested virtualization"
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then sudo chmod 0666 /dev/kvm; fi
          python3 - <<'EOF'
          import fcntl, os
          fd = os.open("/dev/kvm", os.O_RDWR | os.O_CLOEXEC)
          version = fcntl.ioctl(fd, 0xAE00)  # KVM_GET_API_VERSION
          vm = fcntl.ioctl(fd, 0xAE01, 0)  # KVM_CREATE_VM
          assert version == 12, f"unexpected KVM API version {version}"
          os.close(vm)
          print(f"KVM API {version}: created a VM")
          EOF
          printf 'KVM: \x60%s\x60, CPU virtualization flag %s, VM creation succeeded\n\n| Phase | Elapsed |\n| --- | --- |\n' "$(ls -l /dev/kvm)" "$(grep -m1 -oE 'vmx|svm' /proc/cpuinfo || echo none)" >> "$GITHUB_STEP_SUMMARY"
        if: "!(needs.evidence-gate-isolation-vm.outputs.skip == 'true')"
      - name: Build the NixOS VM test driver
        id: driver
        run: |
          start=$SECONDS
          nix build --print-build-logs --out-link "$RUNNER_TEMP/vm-driver" .#legacyPackages.x86_64-linux.transport-isolation-vm.driver
          printf '| VM driver build | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"
        if: "!(needs.evidence-gate-isolation-vm.outputs.skip == 'true')"
      - name: Run all three systemd-scope tests in the VM
        id: vmtest
        env:
          ST_ISOLATION_ARCHIVE: "${{ runner.temp }}/ci-test-archives/workspace.tar.zst"
          ST_ISOLATION_WORKSPACE: ${{ github.workspace }}
          ST_ISOLATION_TIMINGS: "${{ runner.temp }}/vm-timings.json"
          ST_ISOLATION_BUILD_WORKSPACE: ${{ env.CI_TEST_BUILD_WORKSPACE }}
        run: |
          start=$SECONDS
          mkdir -p "$RUNNER_TEMP/vm-out"
          "$RUNNER_TEMP/vm-driver/bin/nixos-test-driver" --output_directory "$RUNNER_TEMP/vm-out"
          jq -r '"| VM boot | \(.boot_seconds)s |\n| systemd-scope tests in VM (extract and run) | \(.test_seconds)s |"' "$ST_ISOLATION_TIMINGS" >> "$GITHUB_STEP_SUMMARY"
          printf '| VM test driver total | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"
        if: "!(needs.evidence-gate-isolation-vm.outputs.skip == 'true')"
      - name: Build the sekrets VM test driver
        id: sekrets-driver
        run: |
          start=$SECONDS
          nix build --print-build-logs --out-link "$RUNNER_TEMP/sekrets-vm-driver" .#legacyPackages.x86_64-linux.sekrets-vm.driver
          printf '| sekrets VM driver build | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"
        if: "!(needs.evidence-gate-isolation-vm.outputs.skip == 'true')"
      - name: Run the sekrets gateway test in the VM
        id: sekrets-test
        env:
          ST_SEKRETS_BINARY: ${{ env.CI_SEKRETS_BINARY }}
        run: |
          start=$SECONDS
          mkdir -p "$RUNNER_TEMP/sekrets-vm-out"
          "$RUNNER_TEMP/sekrets-vm-driver/bin/nixos-test-driver" --output_directory "$RUNNER_TEMP/sekrets-vm-out"
          printf '| sekrets VM test | %ss |\n' "$((SECONDS - start))" >> "$GITHUB_STEP_SUMMARY"
        if: "!(needs.evidence-gate-isolation-vm.outputs.skip == 'true')"
      - name: Save Nix outputs
        if: (success() && env.CI_LOCAL_CACHES != '1' && (github.event_name != 'merge_group' || vars.CI_OUTAGE_FAST_QUEUE != 'on')) && !(needs.evidence-gate-isolation-vm.outputs.skip == 'true')
        run: bash scripts/ci-nix-cache save
      - if: (always()) && !(needs.evidence-gate-isolation-vm.outputs.skip == 'true')
        continue-on-error: true
        name: Take the evidence signer from the base commit
        id: evidence-base
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.sha }}
        run: |
          rm -rf "$RUNNER_TEMP/evidence-base" && mkdir "$RUNNER_TEMP/evidence-base"
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --quiet --depth=1 origin "$BASE_SHA"
          git archive "$BASE_SHA" scripts | tar -x -C "$RUNNER_TEMP/evidence-base"
      - if: (always() && steps.evidence-base.outcome == 'success') && !(needs.evidence-gate-isolation-vm.outputs.skip == 'true')
        continue-on-error: true
        name: May this job use the signing key?
        id: evidence-guard
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: python3 "$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing" guard
      - if: (always() && steps.evidence-guard.outcome == 'success') && !(needs.evidence-gate-isolation-vm.outputs.skip == 'true')
