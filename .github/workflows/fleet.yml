        run: nix develop -c python3 scripts/ci-test-archive consume
        env:
          CI_TEST_ARCHIVE_MANIFEST_SHA256: ${{ needs.linux-test-build.outputs.manifest-sha256 }}
          CI_TEST_ARCHIVE_PRODUCER_ATTEMPT: ${{ needs.linux-test-build.outputs.producer-attempt }}
        if: "!(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')"
      - name: Install matching rendered hooks
        shell: bash
        run: nix develop -c bash scripts/ci-install-built-hooks
        if: "!(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')"
      - name: Summarize tested revision
        run: "printf 'Checked merge/commit: \\x60%s\\x60 on %s CPUs, %s\\n\\n| Stage | Result | Elapsed | Exit |\\n| --- | --- | --- | --- |\\n' \"$(git rev-parse HEAD)\" \"$(nproc)\" \"$(free -h | awk '/^Mem:/ {print $2 \" memory\"}')\" >> \"$GITHUB_STEP_SUMMARY\""
        if: "!(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')"
      - name: Require every harness to hold old mail across boot and reconnect
        shell: bash
        run: nix develop -c bash scripts/ci-linux mail-redelivery-canaries
        if: "!(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')"
      - name: Save Nix outputs to the local Nix cache
        if: (success() && env.CI_LOCAL_CACHES != '1' && (github.event_name != 'merge_group' || vars.CI_OUTAGE_FAST_QUEUE != 'on')) && !(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')
        run: 'bash scripts/ci-nix-cache save || echo "::warning::could not save the local Nix cache"'
      - name: Save main nix-cache
        if: (success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && env.CI_LOCAL_CACHES != '1' && steps.nix-cache.outputs.cache-hit != 'true') && !(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.temp }}/st-ci-cache"
          key: "nix5-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix', '.github/fleet-compat-baseline.json', '.github/messaging-compat-baseline.json') }}"
      - id: build-snapshot-save
        name: Keep valid same-source build outputs
        if: (!cancelled() && (github.event_name != 'merge_group' || vars.CI_OUTAGE_FAST_QUEUE != 'on')) && !(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')
        env:
          CI_SNAPSHOT_PIPELINE: ${{ github.workflow_sha }}
        run: 'python3 "${CI_BUILD_SNAPSHOT_SCRIPT:-scripts/ci-build-snapshot}" pack'
      - id: build-snapshot-upload
        name: Retain the same-source build snapshot
        if: (!cancelled() && steps.build-snapshot-save.outputs.publish == 'true') && !(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-snapshot-save.outputs.name }}
          path: "${{ runner.temp }}/ci-build-snapshot/build.tar.zst"
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          overwrite: true
      - name: Wait before retrying build snapshot retention
        if: (!cancelled() && steps.build-snapshot-upload.outcome == 'failure') && !(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')
        timeout-minutes: 1
        shell: bash
        run: 'echo "::warning::Build snapshot upload failed; retrying once in 15 seconds."; sleep 15'
      - name: Retry retaining the same-source build snapshot
        if: (!cancelled() && steps.build-snapshot-upload.outcome == 'failure') && !(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-snapshot-save.outputs.name }}
          path: "${{ runner.temp }}/ci-build-snapshot/build.tar.zst"
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          overwrite: true
      - name: Retain stage logs and timings
        uses: actions/upload-artifact@v4
        if: (always()) && !(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')
        with:
          name: mail-redelivery-canaries-logs
          path: |
            ${{ runner.temp }}/ci-logs/
            target/messaging-faults/
            target/boot-canaries/
          if-no-files-found: ignore
      - if: (always()) && !(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')
        continue-on-error: true
        name: Take the evidence signer from the base commit
        id: evidence-base
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.sha }}
        run: |
          rm -rf "$RUNNER_TEMP/evidence-base" && mkdir "$RUNNER_TEMP/evidence-base"
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --quiet --depth=1 origin "$BASE_SHA"
          git archive "$BASE_SHA" scripts | tar -x -C "$RUNNER_TEMP/evidence-base"
      - if: (always() && steps.evidence-base.outcome == 'success') && !(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')
        continue-on-error: true
        name: May this job use the signing key?
        id: evidence-guard
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: python3 "$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing" guard
      - if: (always() && steps.evidence-guard.outcome == 'success') && !(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')
        continue-on-error: true
        name: Write the signer configuration and key
        id: evidence-configure
        env:
          EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}
        run: |
          set -o pipefail
          python3 "$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing" configure | tee "$RUNNER_TEMP/evidence-signer-home"
      - if: (always() && steps.evidence-configure.outcome == 'success') && !(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')
        continue-on-error: true
        name: Sign this stage result
        env:
          STAGE: mail-redelivery-canaries
          STAGE_JOB: mail-redelivery-canaries
          GATE_SKIP: ${{ needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true' }}
          PROJECT_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.sha }}
        run: |
          helper="$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing"
          python3 "$helper" once "$STAGE_JOB"
          python3 "$helper" stage-facts "$RUNNER_TEMP/job-facts.json"
          home=$(tail -n 1 "$RUNNER_TEMP/evidence-signer-home")
          HOME="$home" python3 "$RUNNER_TEMP/evidence-base/scripts/evidence-wrap" --check "$STAGE_JOB" \
            --aggregate "$RUNNER_TEMP/job-facts.json" --attempt "$GITHUB_RUN_ATTEMPT" \
            --change-id "github:$GITHUB_REPOSITORY@$GITHUB_SHA" \
            --signer '["python3","'"$RUNNER_TEMP"'/evidence-base/scripts/evidence-sign"]' \
            --out "$RUNNER_TEMP/evidence-notes"
      - if: (always()) && !(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')
        continue-on-error: true
        name: Remove the key
        run: python3 "$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing" cleanup
      - if: (always()) && !(needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true')
        continue-on-error: true
        name: Retain the signed note
        uses: actions/upload-artifact@v4
        with:
          name: evidence-note-mail-redelivery-canaries
          path: "${{ runner.temp }}/evidence-notes/"
          if-no-files-found: ignore
          retention-days: 7
      - name: evidence covered by a trusted note
        if: needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true'
        env:
          RECORDS: "${{ needs.evidence-gate-linux-gate.outputs.record }} ${{ needs.evidence-gate-mail-redelivery-canaries.outputs.record }}"
        run: 'echo "covered by trusted evidence note: $RECORDS" >> "$GITHUB_STEP_SUMMARY"'
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_ENTRIES: '[{"name":"Restore the local Nix cache","outcome":"${{ steps.nix-cache.outcome }}","hit":"${{ steps.nix-cache.outputs.cache-hit }}","matched":"${{ steps.nix-cache.outputs.cache-matched-key }}","opaqueFallback":false,"sourceOnly":false,"avoidable":"","lookup":false}]'
        run: 'python3 "${CI_CACHE_AUDIT_SCRIPT:-scripts/ci-cache-audit}"'
    needs:
      [
        pick-runner,
        linux-test-build,
        evidence-gate-linux-gate,
        evidence-gate-mail-redelivery-canaries,
      ]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (!cancelled()) }}
  linux-gate:
    name: linux-gate
    needs:
      - pick-runner
      - evidence-gate-linux-gate
      - linux-test-build
      - upgrade-impact
      - linux-tests
      - linux-tests-shard-2
      - linux-tests-shard-3
      - linux-tests-shard-4
      - linux-clippy
      - linux-fleet-compat
      - mail-redelivery-canaries
      - evidence-gate-mail-redelivery-canaries
      - evidence-gate-isolation-vm
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (always()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every Linux stage to pass
        env:
          GATE_SKIP: ${{ needs.evidence-gate-linux-gate.outputs.skip }}
          RESULTS: "${{ needs.linux-test-build.result }} ${{ needs.upgrade-impact.result }} ${{ needs.linux-tests.result }} ${{ needs.linux-tests-shard-2.result }} ${{ needs.linux-clippy.result }} ${{ needs.linux-fleet-compat.result }} ${{ needs.mail-redelivery-canaries.result }}"
          EVENT: ${{ github.event_name }}
          MERGE_RESULTS: "${{ needs.linux-tests-shard-3.result }} ${{ needs.linux-tests-shard-4.result }}"
          STAGE_SKIPS: "${{ (needs.evidence-gate-linux-gate.outputs.skip == 'true') && (needs.evidence-gate-linux-gate.outputs.skip == 'true' || needs.evidence-gate-mail-redelivery-canaries.outputs.skip == 'true') && (needs.evidence-gate-isolation-vm.outputs.skip == 'true') }} false ${{ needs.evidence-gate-linux-gate.outputs.skip == 'true' }} ${{ needs.evidence-gate-linux-gate.outputs.skip == 'true' }} ${{ needs.evidence-gate-linux-gate.outputs.skip == 'true' }} ${{ needs.evidence-gate-linux-gate.outputs.skip == 'true' }} false ${{ needs.evidence-gate-linux-gate.outputs.skip == 'true' }} ${{ needs.evidence-gate-linux-gate.outputs.skip == 'true' }}"
        run: |
          set -eu
          set -- $RESULTS
          [ "$#" = 7 ] || { echo "incomplete base-stage results"; exit 1; }
          if [ "$EVENT" = merge_group ]; then
            set -- $MERGE_RESULTS
            [ "$#" = 2 ] || { echo "incomplete merge-shard results"; exit 1; }
            RESULTS="$RESULTS $MERGE_RESULTS"
          else
            [ "$MERGE_RESULTS" = "skipped skipped" ] || { echo "extra shards must be merge-only"; exit 1; }
          fi
          echo "stage results: $RESULTS (evidence skip: ${GATE_SKIP:-none})"
          position=0
          for result in $RESULTS; do
            position=$((position + 1))
            [ "$result" = success ] && continue
            # A stage the evidence gate skipped reports `skipped`: accepted only when this gate decided to skip, only
            # in the positions of stages skipped at job level, only when that stage's own skip rule says skip, and never
            # for a failure or a cancellation.
            flag=$(printf '%s\n' "${STAGE_SKIPS:-}" | cut -d' ' -f"$position")
            if [ "${GATE_SKIP:-}" = true ] && [ "$flag" = true ] && [ "$result" = skipped ]; then
              case "$position" in 1|3|4|5|6|8|9) continue ;; esac
            fi
            exit 1
          done
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_REASON: Collects completed checks and builds nothing.
        run: "printf 'Cache coverage: **not applicable** — %s\\n' \"$CACHE_REASON\" >> \"$GITHUB_STEP_SUMMARY\""
  evidence-note-linux-gate:
    name: evidence-note-linux-gate
    needs:
      - linux-gate
      - linux-test-build
      - upgrade-impact
      - linux-tests
      - linux-tests-shard-2
      - linux-tests-shard-3
      - linux-tests-shard-4
      - linux-clippy
      - linux-fleet-compat
      - mail-redelivery-canaries
      - genie-freshness
      - typescript-client
      - isolation-vm
      - evidence-gate-linux-gate
      - evidence-gate-mail-redelivery-canaries
      - evidence-gate-isolation-vm
      - evidence-gate-genie-freshness
      - evidence-gate-typescript-client
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (always() && (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) }}
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'merge_group' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && 'evidence-signing' || '' }}
    permissions:
      contents: write
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      EVIDENCE_PUSH_TOKEN: ${{ github.token }}
      PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_USER: ${{ github.event.pull_request.user.login }}
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Check out the tested commit
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Take the signer scripts from the base commit
        id: base
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.sha }}
        run: |
          rm -rf "$RUNNER_TEMP/evidence-base" && mkdir "$RUNNER_TEMP/evidence-base"
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --quiet origin "$BASE_SHA"
          git archive "$BASE_SHA" scripts | tar -x -C "$RUNNER_TEMP/evidence-base"
      - name: May this job use the signing key?
        id: guard
        continue-on-error: true
        run: python3 "$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing" guard
      - name: Write the signer configuration and key
        id: configure
        if: ${{ steps.guard.outcome == 'success' }}
        continue-on-error: true
        env:
          EVIDENCE_SIGNING_KEY: ${{ secrets.EVIDENCE_SIGNING_KEY }}
        run: |
          set -o pipefail
          python3 "$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing" configure | tee "$RUNNER_TEMP/evidence-signer-home"
      - name: Sign the linux-gate note
        id: sign
        if: ${{ steps.configure.outcome == 'success' }}
        continue-on-error: true
        run: |
          helper="$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing"
          python3 "$helper" once linux-gate
          python3 "$helper" aggregate "$RUNNER_TEMP/gate-facts.json"
          home=$(tail -n 1 "$RUNNER_TEMP/evidence-signer-home")
          HOME="$home" python3 "$RUNNER_TEMP/evidence-base/scripts/evidence-wrap" --check linux-gate \
            --aggregate "$RUNNER_TEMP/gate-facts.json" --attempt "$GITHUB_RUN_ATTEMPT" \
            --change-id "github:$GITHUB_REPOSITORY@$GITHUB_SHA" --toolchain-sha256 "$(printf 'github-hosted|%s' "${ImageVersion:-unknown}" | sha256sum | cut -d' ' -f1)" \
            --signer '["python3","'"$RUNNER_TEMP"'/evidence-base/scripts/evidence-sign"]' --out "$RUNNER_TEMP/evidence-notes/gate"
      - name: Collect the stage notes
        if: ${{ steps.sign.outcome == 'success' }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: evidence-note-*
          path: "${{ runner.temp }}/evidence-notes/stages"
          merge-multiple: true
      - name: Publish the notes that verify
        if: ${{ steps.sign.outcome == 'success' }}
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.sha }}
        run: |
          git show "$BASE_SHA:.st/evidence-keys" > "$RUNNER_TEMP/evidence-keys" || { echo "::warning::no .st/evidence-keys at the base commit; nothing is published"; exit 1; }
          python3 "$RUNNER_TEMP/evidence-base/scripts/evidence-publish" --notes "$RUNNER_TEMP/evidence-notes" \
            --keys "$RUNNER_TEMP/evidence-keys" --checks "linux-gate,linux-tests,linux-tests-shard-2,linux-tests-shard-3,linux-tests-shard-4,linux-clippy,linux-fleet-compat,mail-redelivery-canaries,genie-freshness,typescript-client,isolation-vm" --remote origin
      - name: Remove the key
        if: always()
        continue-on-error: true
        run: python3 "$RUNNER_TEMP/evidence-base/scripts/ci-evidence-signing" cleanup
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_REASON: Signs the aggregate gate result from workflow context; builds nothing.
        run: "printf 'Cache coverage: **not applicable** — %s\\n' \"$CACHE_REASON\" >> \"$GITHUB_STEP_SUMMARY\""
  perf-cost:
    name: perf-cost
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'merge_group') }}
    runs-on:
      [
        "nscloud-ubuntu-24.04-amd64-8x16-with-features;job.priority=${{ github.event_name == 'merge_group' && 1 || 3 }}",
        "namespace-features:github.run-id=${{ github.run_id }}",
      ]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
      CI_CACHE_DEV_SHELL: default
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the runner's own caches
        run: |
          if [ -n "${CI_LOCAL_CARGO_HOME:-}" ]; then echo CI_LOCAL_CACHES=1 >> "$GITHUB_ENV"; fi
          printf 'CARGO_HOME=%s\nCI_CACHE_DIR=%s\n' "${CI_LOCAL_CARGO_HOME:-$RUNNER_TEMP/cargo-home}" "$RUNNER_TEMP/st-ci-cache" >> "$GITHUB_ENV"
      - id: build-snapshot
        name: Restore the exact-source build snapshot
        if: env.CI_LOCAL_CACHES != '1'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SNAPSHOT_PIPELINE: ${{ github.workflow_sha }}
        run: 'python3 "${CI_BUILD_SNAPSHOT_SCRIPT:-scripts/ci-build-snapshot}" restore'
      - name: Restore the Cargo target and registry
        id: cargo-cache
        if: env.CI_LOCAL_CACHES != '1' && env.CI_BUILD_SNAPSHOT_HIT != '1'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/target
            ${{ runner.temp }}/cargo-home/registry
            ${{ runner.temp }}/cargo-home/git
          key: "cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock', 'Cargo.toml', 'crates/**/Cargo.toml', '.cargo/config.toml') }}"
          restore-keys: "cargo-${{ github.job }}-${{ runner.os }}-"
      - name: Restore the local Nix cache
        id: nix-cache
        if: env.CI_LOCAL_CACHES != '1' && env.CI_BUILD_SNAPSHOT_HIT != '1'
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.temp }}/st-ci-cache"
          key: "nix5-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock', 'flake.nix', 'nix/**/*.nix', '.github/fleet-compat-baseline.json', '.github/messaging-compat-baseline.json') }}"
          restore-keys: |
            nix5-${{ github.job }}-${{ runner.os }}-
            nix4-${{ github.job }}-${{ runner.os }}-
      - name: Remember genuine source inputs before compiling
        run: 'python3 "${CI_BUILD_SNAPSHOT_SCRIPT:-scripts/ci-build-snapshot}" prepare'
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://overeng-effect-utils.cachix.org
            extra-trusted-public-keys = overeng-effect-utils.cachix.org-1:KFmqYNF6Q7ZzVYPl2znpJYZGEolage9YNCA9res6vKc=
            access-tokens = github.com=${{ github.token }}
          summarize: true
      - name: Isolate test home and XDG state
        run: |
          # Cargo's home and the CI cache directory live under RUNNER_TEMP, not HOME: tests get an isolated HOME,
          # and actions/cache expands a leading tilde against the HOME of the step that runs it.
          printf 'CARGO_HOME=%s\nCI_CACHE_DIR=%s\n' "${CI_LOCAL_CARGO_HOME:-$RUNNER_TEMP/cargo-home}" "$RUNNER_TEMP/st-ci-cache" >> "$GITHUB_ENV"
          home="$RUNNER_TEMP/test-home"
          mkdir -p "$home" "$home/.config" "$home/.cache" "$home/.local/state"
          printf 'HOME=%s\nXDG_CONFIG_HOME=%s/.config\nXDG_CACHE_HOME=%s/.cache\nXDG_STATE_HOME=%s/.local/state\n' "$home" "$home" "$home" "$home" >> "$GITHUB_ENV"
      - name: Use the cached Nix outputs
        if: env.CI_LOCAL_CACHES != '1'
        run: 'bash scripts/ci-nix-cache use || echo "::warning::the local Nix cache is unavailable; this run builds everything"'
      - name: Summarize tested revision
        run: "printf 'Checked merge/commit: \\x60%s\\x60 on %s CPUs, %s\\n\\n| Stage | Result | Elapsed | Exit |\\n| --- | --- | --- | --- |\\n' \"$(git rev-parse HEAD)\" \"$(nproc)\" \"$(free -h | awk '/^Mem:/ {print $2 \" memory\"}')\" >> \"$GITHUB_STEP_SUMMARY\""
      - name: Restore the generated stores
        if: env.CI_BUILD_SNAPSHOT_STORES_HIT != '1'
        uses: actions/cache@v4
        with:
          path: "${{ runner.temp }}/st-bench"
          key: "perf-cost-stores-${{ hashFiles('crates/st3/tests/daemon_bench.rs', 'docs/st3/schema.md') }}"
        id: cache-10
      - name: Run the cost check
        shell: bash
        run: nix develop -c bash scripts/ci-perf cost
      - name: Save Nix outputs to the local Nix cache
