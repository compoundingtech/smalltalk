      - name: evidence satisfied by existing note
        if: steps.gate.outputs.outcome == 'satisfied'
        run: echo evidence satisfied by existing note
      - name: evidence existing note is degraded
        if: steps.gate.outputs.outcome == 'degraded'
        run: echo evidence existing note is degraded
      - name: evidence no note
        if: steps.gate.outputs.outcome == 'no_note'
        run: echo evidence no note
      - name: evidence note rejected
        if: steps.gate.outputs.outcome == 'rejected'
        run: echo evidence note rejected
