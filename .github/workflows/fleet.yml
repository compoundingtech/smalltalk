name: ci1 runtime smoke
on:
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [first, second]
        default: first
permissions:
  contents: read
jobs:
  hashfiles:
    strategy:
      fail-fast: false
      matrix:
        slot: [1, 2, 3, 4, 5, 6]
    runs-on: [ci1-merge]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Verify isolated persistent tool cache
        env:
          PHASE: ${{ inputs.phase }}
        run: |
          test "$(node --version)" = v24.18.0
          test "$RUNNER_TOOL_CACHE" = /run/ci-cache/tools
          marker="$RUNNER_TOOL_CACHE/ci1-toolcache-proof-$RUNNER_NAME"
          if [ "$PHASE" = second ]; then test -f "$marker"; fi
          printf '%s\n' "$RUNNER_NAME" > "$marker"
      - name: Prepare digest fixture
        run: printf 'runtime regression\n' > ci1-lock.json
      - name: Evaluate real Actions hashFiles expressions
        env:
          ACTUAL: ${{ hashFiles('ci1-lock.json') }}
          MISSING: ${{ hashFiles('ci1-lock-does-not-exist.json') }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, os
          from pathlib import Path
          expected = hashlib.sha256(hashlib.sha256(Path('ci1-lock.json').read_bytes()).digest()).hexdigest()
          assert os.environ['ACTUAL'] == expected
          assert os.environ['MISSING'] == ''
          print('Actual Actions expressions returned the expected digest and empty unmatched result')
          PYTHON
          sleep 20
