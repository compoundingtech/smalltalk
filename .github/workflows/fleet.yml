      - name: evidence covered by a trusted note
        if: needs.evidence-gate-isolation-vm.outputs.skip == 'true'
        env:
          RECORDS: ${{ needs.evidence-gate-isolation-vm.outputs.record }}
        run: 'echo "covered by trusted evidence note: $RECORDS" >> "$GITHUB_STEP_SUMMARY"'
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_ENTRIES: '[{"name":"Restore the local Nix cache","outcome":"${{ steps.nix-cache.outcome }}","hit":"${{ steps.nix-cache.outputs.cache-hit }}","matched":"${{ steps.nix-cache.outputs.cache-matched-key }}","opaqueFallback":false,"sourceOnly":false,"avoidable":"","lookup":false}]'
        run: 'python3 "${CI_CACHE_AUDIT_SCRIPT:-scripts/ci-cache-audit}"'
  fractal-web-changes:
    name: fractal-web-changes
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
      kit-inputs: ${{ steps.detect.outputs.kit-inputs }}
    steps:
      - name: Detect web-relevant changes
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          REMOTE: "${{ github.server_url }}/${{ github.repository }}.git"
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """Decide whether a Workspace CI event must run the fractal-web execution lane.

          Pull requests diff the immutable base and head SHAs from their merge base; merge groups diff the
          queued group's base_sha..head_sha and pushes diff before..after, including every pushed commit.
          Both commits are fetched explicitly. Renames are split into a deletion and an addition, so both
          paths are matched. If the diff cannot be determined, all web lanes run. Manual runs always execute.
          """

          import os
          import re
          import subprocess
          import sys
          import tempfile

          # Directory patterns end in `/**`; `*` stays within one path component.
          PATTERNS = (
              "apps/fractal-web/**",
              "packages/fractal-ui/**",
              # Export graph consumed by the app/SDK and Buck's client typecheck inputs.
              "clients/typescript/st3-client/index.ts",
              "clients/typescript/st3-client/Models.generated.ts",
              "clients/typescript/st3-client/Client.generated.ts",
              "clients/typescript/st3-client/Schema.generated.ts",
              "clients/typescript/st3-client/errors.ts",
              "clients/typescript/st3-client/package.json",
              "clients/typescript/st3-client/tsconfig.json",
              "clients/typescript/st3-client/tsconfig.schema.json",
              "clients/typescript/st3-client/types.test.ts",
              "clients/typescript/st3-client/BUCK*",
              "clients/typescript/st3-views/**",
              "clients/typescript/st3-scenarios/**",
              # Views tests and scenario lanes read committed client/scenario fixtures.
              "fixtures/**",
              "package.json*",
              "pnpm-workspace.yaml*",
              "pnpm-lock.yaml",
              "megarepo.kdl",
              "megarepo.lock",
              "flake.lock",
              "pnpm-install-contract.json*",
              ".npmrc",
              "flake.nix",
              "tsconfig*.json*",
              ".buckroot*",
              ".buckconfig*",
              "BUCK*",
              "buck2/**",
              "genie/**",
              "nix/web/**",
              "nix/fractal-web*.nix",
              "scripts/ci-fractal-web*",
              "scripts/ci-typescript-client*",
              ".github/workflows/fleet.yml*",
              ".github/workflows/workspace-ci.ts",
              ".github/workflows/main-upkeep.yml*",
              ".github/workflows/cache-audit.ts",
              ".github/repo-settings.json*",
          )
          # Keep workspace dependency coverage in sync with the guarded package graph in ci-fractal-web-test.
          # scripts/ci-fractal-web-kit-graph fails the kit lane when the built Storybook bundles a file outside these.
          KIT_PATTERNS = (
              "packages/fractal-ui/**",
              # Changelog stories render the app's changelog view and seen state.
              "apps/fractal-web/src/changelog/**",
              "apps/fractal-web/src/web/ColdOpen.stories.tsx",
              "apps/fractal-web/src/web/coldOpen.fixtures.ts",
              "apps/fractal-web/src/web/index.html",
              "clients/typescript/st3-scenarios/**",
              "clients/typescript/st3-client/**",
              "package.json*",
              "pnpm-workspace.yaml*",
              "pnpm-lock.yaml",
              "pnpm-install-contract.json*",
              ".npmrc",
              "flake.nix",
              "flake.lock",
              "scripts/ci-fractal-web*",
              ".github/workflows/fleet.yml*",
              ".github/workflows/workspace-ci.ts",
          )
          SHA = re.compile(r"[0-9a-f]{40}")


          def pattern_regex(pattern):
              parts = re.split(r"(\*\*|\*)", pattern)
              body = "".join(".*" if part == "**" else "[^/]*" if part == "*" else re.escape(part) for part in parts)
              # DOTALL: Git paths may legally contain newlines, and `**` must still cover them.
              return re.compile(body + r"\Z", re.DOTALL)


          MATCHERS = tuple(pattern_regex(pattern) for pattern in PATTERNS)
          KIT_MATCHERS = tuple(pattern_regex(pattern) for pattern in KIT_PATTERNS)


          def kit_paths(paths):
              return [path for path in paths if any(matcher.match(path) for matcher in KIT_MATCHERS)]


          def relevant_paths(paths):
              return [path for path in paths if any(matcher.match(path) for matcher in (*MATCHERS, *KIT_MATCHERS))]


          def git(directory, *args):
              return subprocess.run(["git", "-C", directory, *args], check=True, capture_output=True, text=True, timeout=45).stdout


          def changed_paths(remote, event, base, head):
              for name, value in (("base", base), ("head", head)):
                  if not SHA.fullmatch(value):
                      raise ValueError(f"{event} {name} SHA is missing or malformed: {value!r}")
              with tempfile.TemporaryDirectory() as directory:
                  git(directory, "init", "--quiet")
                  # Commit history without blobs: enough for the merge base and a name-only tree diff.
                  git(directory, "fetch", "--quiet", "--no-tags", "--filter=blob:none", remote, base, head)
                  start = git(directory, "merge-base", base, head).strip() if event == "pull_request" else base
                  if not SHA.fullmatch(start):
                      raise ValueError(f"no merge base for {base} and {head}")
                  output = git(directory, "diff", "--name-only", "--no-renames", "-z", start, head)
              return [path for path in output.split("\0") if path]


          def main():
              event = os.environ.get("EVENT", "")
              summary = []
              if event == "workflow_dispatch":
                  relevant, kit_inputs, summary = True, True, ["Manual run: web execution and kit plays are forced."]
              elif event in ("pull_request", "merge_group", "push"):
                  try:
                      paths = changed_paths(os.environ["REMOTE"], event, os.environ.get("BASE_SHA", ""), os.environ.get("HEAD_SHA", ""))
                  except (ValueError, subprocess.SubprocessError, OSError) as error:
                      detail = error.stderr.strip() if isinstance(error, subprocess.CalledProcessError) else str(error)
                      print(f"::warning::fractal-web diff unknown; running all lanes: {detail}", file=sys.stderr)
                      relevant, kit_inputs = True, True
                      summary = ["Diff unavailable: all web lanes, including kit plays, are required."]
                  else:
                      matched = relevant_paths(paths)
                      relevant = bool(matched)
                      kit_inputs = bool(kit_paths(paths))
                      summary = [f"{len(paths)} changed path(s), {len(matched)} web-relevant."] + [f"- `{path}`" for path in matched[:50]]
              else:
                  raise ValueError(f"unsupported event {event!r}")
              with open(os.environ["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"relevant={'true' if relevant else 'false'}\n")
                  output.write(f"kit-inputs={'true' if kit_inputs else 'false'}\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as step_summary:
                  step_summary.write("\n".join([f"fractal-web execution: **{'required' if relevant else 'not required'}**", *summary]) + "\n")
              print(f"relevant={'true' if relevant else 'false'}")
              print(f"kit-inputs={'true' if kit_inputs else 'false'}")
              return 0


          if __name__ == "__main__":
              try:
                  sys.exit(main())
              except Exception as error:  # Fail closed on every detector error.
                  detail = error.stderr.strip() if isinstance(error, subprocess.CalledProcessError) else str(error)
                  print(f"::error::fractal-web change detection failed: {detail}", file=sys.stderr)
                  sys.exit(1)

          PY
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_REASON: Diffs two fetched commits without blobs and builds nothing.
        run: "printf 'Cache coverage: **not applicable** — %s\\n' \"$CACHE_REASON\" >> \"$GITHUB_STEP_SUMMARY\""
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (success()) }}
  fractal-web-execution:
    name: fractal-web-execution
    needs: [fractal-web-changes, genie-freshness]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (!cancelled() && needs.fractal-web-changes.result == 'success' && needs.fractal-web-changes.outputs.relevant == 'true' && needs.genie-freshness.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://overeng-effect-utils.cachix.org
            extra-trusted-public-keys = overeng-effect-utils.cachix.org-1:KFmqYNF6Q7ZzVYPl2znpJYZGEolage9YNCA9res6vKc=
            access-tokens = github.com=${{ github.token }}
          summarize: true
      - name: Restore the pnpm store
        id: pnpm-store
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.temp }}/pnpm-store"
          key: "fractal-web-pnpm-${{ runner.os }}-pnpm12.7.0-node24.20.0-${{ hashFiles('pnpm-lock.yaml') }}"
      - name: Run the fractal-web lanes and dependency license check
        shell: bash
        run: "nix develop '.#web' -c bash scripts/ci-fractal-web"
        env:
          pnpm_config_store_dir: "${{ runner.temp }}/pnpm-store"
          KIT_INPUTS: ${{ needs.fractal-web-changes.outputs.kit-inputs }}
          KIT_PLAY_SET: ${{ github.event_name == 'pull_request' && 'commit' || 'all' }}
          KIT_PLAY_A11Y: ${{ github.event_name == 'pull_request' && 'off' || 'on' }}
          KIT_PLAY_MAX_SECONDS: ${{ github.event_name == 'pull_request' && '100' || '' }}
          APP_TEST_SET: ${{ github.event_name == 'pull_request' && 'related' || 'all' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_ENTRIES: '[{"name":"Restore the pnpm store","outcome":"${{ steps.pnpm-store.outcome }}","hit":"${{ steps.pnpm-store.outputs.cache-hit }}","matched":"${{ steps.pnpm-store.outputs.cache-matched-key }}","opaqueFallback":false,"sourceOnly":false,"avoidable":"","lookup":false}]'
        run: 'python3 "${CI_CACHE_AUDIT_SCRIPT:-scripts/ci-cache-audit}"'
  fractal-web:
    name: fractal-web
    needs: [fractal-web-changes, fractal-web-execution]
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (always()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require detection and, for web changes, execution
        env:
          CHANGES_RESULT: ${{ needs.fractal-web-changes.result }}
          RELEVANT: ${{ needs.fractal-web-changes.outputs.relevant }}
          EXECUTION_RESULT: ${{ needs.fractal-web-execution.result }}
        run: |
          python3 - <<'PY'
          #!/usr/bin/env python3
          """The always-emitted fractal-web check: pass only for a deliberate skip or a successful run.

          Detection must have succeeded. A relevant change then requires a successful execution job; a
          change without web inputs requires that execution was skipped. Failure, timeout, cancellation and
          an unexpected skip all fail the gate.
          """

          import os
          import sys


          def verdict(changes, relevant, execution):
              if changes != "success":
                  return f"change detection ended with {changes or 'no result'}"
              if relevant == "true":
                  return None if execution == "success" else f"web inputs changed but execution ended with {execution or 'no result'}"
              if relevant == "false":
                  return None if execution == "skipped" else f"no web inputs changed but execution ended with {execution or 'no result'}"
              return f"change detection reported no decision ({relevant!r})"


          def main():
              changes, relevant, execution = (os.environ.get(name, "") for name in ("CHANGES_RESULT", "RELEVANT", "EXECUTION_RESULT"))
              print(f"detection: {changes}, relevant: {relevant}, execution: {execution}")
              failure = verdict(changes, relevant, execution)
              if failure:
                  print(f"::error::fractal-web gate failed: {failure}")
                  return 1
              print("fractal-web gate passed")
              return 0


          if __name__ == "__main__":
              sys.exit(main())

          PY
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_REASON: Collects the detection and execution results and builds nothing.
        run: "printf 'Cache coverage: **not applicable** — %s\\n' \"$CACHE_REASON\" >> \"$GITHUB_STEP_SUMMARY\""
