name: Performance

on:
  schedule:
    - cron: 23 2 * * *
  pull_request:
    paths:
      - crates/smallclaims/**
      - crates/st3/src/**
      - crates/st3/tests/daemon_*.rs
      - Cargo.lock
      - scripts/ci-perf
      - .github/workflows/perf.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "perf-${{ github.event.pull_request.number || github.run_id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf-load:
    name: perf-load
    runs-on:
      [namespace-profile-linux-x86-64, "namespace-features:github.run-id=${{ github.run_id }}"]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Restore the Cargo target and registry
        id: cargo-cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/target
            ${{ runner.temp }}/cargo-home/registry
            ${{ runner.temp }}/cargo-home/git
          key: "cargo-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'flake.lock') }}"
          restore-keys: "cargo-${{ github.job }}-${{ runner.os }}-"
      - name: Restore the local Nix cache
        id: nix-cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: "${{ runner.temp }}/st-ci-cache"
          key: "nix4-${{ github.job }}-${{ runner.os }}-${{ hashFiles('flake.lock', '.github/fleet-compat-baseline.json', '.github/messaging-compat-baseline.json') }}"
          restore-keys: "nix4-${{ github.job }}-${{ runner.os }}-"
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://overeng-effect-utils.cachix.org
            extra-trusted-public-keys = overeng-effect-utils.cachix.org-1:KFmqYNF6Q7ZzVYPl2znpJYZGEolage9YNCA9res6vKc=
            access-tokens = github.com=${{ github.token }}
          summarize: true
      - name: Isolate test home and XDG state
        run: |
          # Cargo's home and the CI cache directory live under RUNNER_TEMP, not HOME: tests get an isolated HOME,
          # and actions/cache expands a leading tilde against the HOME of the step that runs it.
          printf 'CARGO_HOME=%s\nCI_CACHE_DIR=%s\n' "$RUNNER_TEMP/cargo-home" "$RUNNER_TEMP/st-ci-cache" >> "$GITHUB_ENV"
          home="$RUNNER_TEMP/test-home"
          mkdir -p "$home" "$home/.config" "$home/.cache" "$home/.local/state"
          printf 'HOME=%s\nXDG_CONFIG_HOME=%s/.config\nXDG_CACHE_HOME=%s/.cache\nXDG_STATE_HOME=%s/.local/state\n' "$home" "$home" "$home" "$home" >> "$GITHUB_ENV"
      - name: Use the cached Nix outputs
        if: runner.os == 'Linux'
        run: 'bash scripts/ci-nix-cache use || echo "::warning::the local Nix cache is unavailable; this run builds everything"'
      - name: Summarize tested revision
        run: "printf 'Checked merge/commit: \\x60%s\\x60 on %s CPUs, %s\\n\\n| Stage | Result | Elapsed | Exit |\\n| --- | --- | --- | --- |\\n' \"$(git rev-parse HEAD)\" \"$(nproc)\" \"$(free -h | awk '/^Mem:/ {print $2 \" memory\"}')\" >> \"$GITHUB_STEP_SUMMARY\""
      - name: Restore the generated stores
        uses: actions/cache@v4
        with:
          path: "${{ runner.temp }}/st-bench"
          key: "perf-load-stores-${{ hashFiles('crates/st3/tests/daemon_bench.rs', 'docs/st3/schema.md') }}"
      - name: Restore main's load test reports
        uses: actions/cache/restore@v4
        with:
          path: "${{ runner.temp }}/perf-baseline"
          key: "perf-load-baseline-${{ github.run_id }}"
          restore-keys: perf-load-baseline-
      - name: Run the load test
        shell: bash
        run: nix develop -c bash scripts/ci-perf load
      - name: Keep this report among main's last five
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/perf-baseline"
          cp "$RUNNER_TEMP/perf/load.json" "${{ runner.temp }}/perf-baseline/load-${{ github.run_id }}.json"
          ls -1 "${{ runner.temp }}/perf-baseline"/load-*.json | sort -V -r | tail -n +6 | xargs -r rm --
      - name: Save the reports
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: "${{ runner.temp }}/perf-baseline"
          key: "perf-load-baseline-${{ github.run_id }}"
      - name: Save Nix outputs to the local Nix cache
        if: success()
        run: 'bash scripts/ci-nix-cache save || echo "::warning::could not save the local Nix cache"'
      - name: Retain stage logs and timings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-load-logs
          path: |
            ${{ runner.temp }}/ci-logs/
            ${{ runner.temp }}/perf/
          if-no-files-found: ignore
