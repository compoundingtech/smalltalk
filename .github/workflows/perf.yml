name: Performance
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  namespace-capacity:
    runs-on:
      - nscloud-ubuntu-24.04-amd64-2x4-with-features;job.priority=1
      - namespace-features:github.run-id=${{ github.run_id }}
    timeout-minutes: 3
    steps:
      - name: Read live Namespace limits and usage
        run: |
          nsc workspace concurrency --output json | jq '{concurrency: [.concurrency[] | {platforms, limits, activeConcurrency}]}' > "$RUNNER_TEMP/namespace-capacity.json"
          cat "$RUNNER_TEMP/namespace-capacity.json"
          nsc github profile list --output json > "$RUNNER_TEMP/namespace-profiles.json"
          jq 'walk(if type == "object" then del(.token,.credentials,.auth) else . end)' "$RUNNER_TEMP/namespace-profiles.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: namespace-capacity
          path: |
            ${{ runner.temp }}/namespace-capacity.json
            ${{ runner.temp }}/namespace-profiles.json
          retention-days: 3
