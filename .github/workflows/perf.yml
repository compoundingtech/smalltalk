# Ephemeral diagnostic branch; not a product workflow change.
name: Performance controlled comparison

on:
  workflow_dispatch:
    inputs:
      source_sha:
        required: true
        type: choice
        options:
          - 705e2333ec6078589445438cf8d77fe3a1568c72
          - 58358162bbad1781c7e5111eacc57749d59a0915
          - 7fbd853ed3c5a2c81a29144ca6fffa36ab88a705
          - 1e20c15d11328b633b8ced9b1ccbb052db65ba32

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: speed-controlled-performance-pair
  cancel-in-progress: false

jobs:
  perf-load:
    name: perf-load
    runs-on:
      [
        nscloud-ubuntu-24.04-amd64-8x16-with-features;job.priority=1,
        "namespace-features:github.run-id=${{ github.run_id }}",
      ]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      SCCACHE_IDLE_TIMEOUT: "0"
      PERF_PR_NUMBER: ${{ github.event.pull_request.number }}
      PERF_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Start the whole-job diagnostic clock
        run: printf 'PERF_DIAGNOSTIC_WHOLE_START=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Preserve the controller outside the clean benchmark checkout
        run: |
          cp scripts/ci-perf-diagnostic.py "$RUNNER_TEMP/ci-perf-diagnostic.py"
          sha256sum "$RUNNER_TEMP/ci-perf-diagnostic.py"
      - name: Check out the frozen benchmark source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Name compatible snapshot recipes
        env:
          PERF_BUILD_SNAPSHOT: "perf-load-build-v1-${{ hashFiles('Cargo.lock', 'flake.lock', 'flake.nix', 'Cargo.toml', 'crates/st3/Cargo.toml', '.cargo/config.toml') }}"
          PERF_STORES_SNAPSHOT: "perf-load-stores-v1-${{ hashFiles('crates/st3/tests/daemon_bench.rs', 'docs/st3/schema.md') }}"
        run: printf "PERF_BUILD_SNAPSHOT=%s\nPERF_STORES_SNAPSHOT=%s\n" "$PERF_BUILD_SNAPSHOT" "$PERF_STORES_SNAPSHOT" >> "$GITHUB_ENV"
      - name: Restore compatible build, Nix, stores and main baseline snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-perf-cache restore
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://overeng-effect-utils.cachix.org
            extra-trusted-public-keys = overeng-effect-utils.cachix.org-1:KFmqYNF6Q7ZzVYPl2znpJYZGEolage9YNCA9res6vKc=
            access-tokens = github.com=${{ github.token }}
          summarize: true
      - name: Isolate test state and keep the compiler cache
        run: |
          home="$RUNNER_TEMP/test-home"
          mkdir -p "$home"/{.config,.cache,.local/state} "$RUNNER_TEMP/cargo-home"/{registry,git} "$RUNNER_TEMP/perf-sccache"
          printf 'CARGO_HOME=%s\nCI_CACHE_DIR=%s\nSCCACHE_DIR=%s\nSCCACHE_CACHE_SIZE=1G\n' "$RUNNER_TEMP/cargo-home" "$RUNNER_TEMP/st-ci-cache" "$RUNNER_TEMP/perf-sccache" >> "$GITHUB_ENV"
          printf 'HOME=%s\nXDG_CONFIG_HOME=%s/.config\nXDG_CACHE_HOME=%s/.cache\nXDG_STATE_HOME=%s/.local/state\n' "$home" "$home" "$home" "$home" >> "$GITHUB_ENV"
      - name: Use the cached Nix outputs
        run: bash scripts/ci-nix-cache use
      - name: Prepare fast scratch space for a new store recipe
        run: if [ ! -s "$RUNNER_TEMP/st-bench/generated-1.sqlite3" ]; then sudo mount -o remount,size=10G /dev/shm; fi
      - name: Run the release load test
        shell: bash
        env:
          PERF_DIAGNOSTIC_SOURCE: ${{ inputs.source_sha }}
          PERF_DIAGNOSTIC_CONTROLLER_SHA256: 70f617367cc43208fd42c3ddadf83a70650c31eadbe12e3af026758312229073
        run: |
          export PERF_DIAGNOSTIC_NIX="$(command -v nix)"
          "$PERF_DIAGNOSTIC_NIX" develop '.#perf' -c python3 "$RUNNER_TEMP/ci-perf-diagnostic.py"
        id: load
      - name: Retain the load report, log and timing
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-load-logs
          path: "${{ runner.temp }}/perf/"
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true
