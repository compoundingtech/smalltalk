      [
        nscloud-ubuntu-24.04-amd64-8x16-with-features;job.priority=1,
        "namespace-features:github.run-id=${{ github.run_id }}",
      ]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Fingerprint locked dependencies
        id: lockfiles
        run: |
          lockfiles_hash=$(sha256sum apps/ios/package-lock.json clients/typescript/st3-client/package-lock.json clients/typescript/st3-views/package-lock.json | sha256sum | cut -d ' ' -f1)
          printf 'hash=%s\n' "$lockfiles_hash" >> "$GITHUB_OUTPUT"
      - name: Cache locked TypeScript dependencies
        id: typescript-cache
        uses: actions/cache@v5
        with:
          path: |
            apps/ios/node_modules
            clients/typescript/st3-client/node_modules
            clients/typescript/st3-views/node_modules
          key: "typescript-client-${{ runner.os }}-node24.18.0-${{ steps.lockfiles.outputs.hash }}"
      - name: Fill missing dependencies
        if: steps.typescript-cache.outputs.cache-hit != 'true'
        run: |
          npm ci --prefix clients/typescript/st3-client --ignore-scripts --no-audit --no-fund
          npm ci --prefix clients/typescript/st3-views --ignore-scripts --no-audit --no-fund
          npm ci --prefix apps/ios --ignore-scripts --no-audit --no-fund
      - name: Report job cache coverage
        if: always()
        shell: bash
        env:
          CACHE_ENTRIES: '[{"name":"Cache locked TypeScript dependencies","outcome":"${{ steps.typescript-cache.outcome }}","hit":"${{ steps.typescript-cache.outputs.cache-hit }}","matched":"","opaqueFallback":true,"sourceOnly":false,"avoidable":"","lookup":false}]'
        run: 'python3 "${CI_CACHE_AUDIT_SCRIPT:-scripts/ci-cache-audit}"'
  perf-cost:
    name: perf-cost
    runs-on:
      [
        nscloud-ubuntu-24.04-amd64-8x16-with-features;job.priority=1,
        "namespace-features:github.run-id=${{ github.run_id }}",
      ]
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"
