            /nix
      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          extra-conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://overeng-effect-utils.cachix.org
            extra-trusted-public-keys = overeng-effect-utils.cachix.org-1:KFmqYNF6Q7ZzVYPl2znpJYZGEolage9YNCA9res6vKc=
            access-tokens = github.com=${{ github.token }}
          summarize: true
      - name: Isolate test home and XDG state
        run: |
          # The cached Cargo registry lives under the real HOME; tests get the isolated one.
          printf 'CARGO_HOME=%s\nCI_CLIPPY_TARGET=%s\n' "${CARGO_HOME:-$HOME/.cargo}" "$HOME/.cache/st-ci/clippy-target" >> "$GITHUB_ENV"
          home="$RUNNER_TEMP/test-home"
