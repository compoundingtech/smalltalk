# The root stays a real package (not a virtual manifest): `flake.nix` reads
# `package.version` out of this file as the single source of truth for the
# build, and a virtual root has no `[package]` to read.
[workspace]
members = [
  "components/github-issue",
  "components/github-pr",
  "components/pty-stats",
  "components/vista",
  "crates/agent-spec",
  "crates/demo-resolver-wasm",
  "crates/smallclaims",
  "crates/st-drivers",
  "crates/st-runtime",
  "crates/st-resource-protocol",
  "crates/st2-resource-providers",
  "crates/st2-resource-wasip2",
  "crates/st-wire",
  "crates/st3",
  "crates/st3-client",
  "crates/st3-client-codegen",
  "crates/st3-conversation-ui",
  "crates/st3-feed",
  "crates/st3-migrate",
  "crates/st3-schema",
  "crates/st3-ui-model",
  "crates/stui",
]
default-members = [
  ".",
  "crates/agent-spec",
  "crates/smallclaims",
  "crates/st-drivers",
  "crates/st-runtime",
  "crates/st-resource-protocol",
  "crates/st-wire",
  "crates/st3",
  "crates/st3-client",
  "crates/st3-conversation-ui",
  "crates/st3-feed",
  "crates/st3-migrate",
  "crates/st3-schema",
  "crates/st3-ui-model",
  "crates/stui",
]

exclude = ["vendor/libghostty-vt-sys"]

[workspace.dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }

# The published 0.2.1 crate with one build-script change so Zig 0.15.2 can link against current
# macOS SDKs; see vendor/libghostty-vt-sys/README.md.
[patch.crates-io]
libghostty-vt-sys = { path = "vendor/libghostty-vt-sys" }

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1

[profile.test.package."*"]
debug = 0

[package]
name = "st2"
version = "0.1.0"
edition = "2024"
description = "Harness-agnostic runner: reconcile a unified catalog+inbox folder of rendered agent specs, keep their ptys running, and deliver messages by moving inbox files."
license = "MIT"
# Every file in tests/ is a module of one test binary; see tests/integration.rs.
autotests = false

[[bin]]
name = "st2"
path = "src/main.rs"

[lib]
name = "st2"
path = "src/lib.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

# These set process-wide environment variables, so each stays a test binary of its own.
[[test]]
name = "agent_resource"
path = "tests/agent_resource.rs"

[[test]]
name = "driver_expansion"
path = "tests/driver_expansion.rs"

[[test]]
name = "event_e2e"
path = "tests/event_e2e.rs"

[[test]]
name = "resource_profile_supervisor_e2e"
path = "tests/resource_profile_supervisor_e2e.rs"

[dependencies]
# Sync by design: the runner is I/O-light (shell-outs to `pty` plus a
# folder watch + a sleep), so no tokio. Deps grow per milestone; M0 needs only parse + CLI.
agent-spec = { path = "crates/agent-spec" }
st-drivers = { path = "crates/st-drivers" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
kdl = "6"
libc = "0.2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
st2-resource-protocol = { package = "st-resource-protocol", path = "crates/st-resource-protocol" }
st2-resource-providers = { path = "crates/st2-resource-providers", optional = true }
st2-resource-wasip2 = { path = "crates/st2-resource-wasip2", optional = true, features = ["runtime"] }
st2-wire = { package = "st-wire", path = "crates/st-wire" }
tempfile = "3"
toml = "0.9"
opentelemetry = "0.30"
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["http-json", "reqwest-blocking-client", "internal-logs", "logs"] }
opentelemetry_sdk = { version = "0.30", features = ["spec_unstable_metrics_views", "logs"] }
# `experimental_use_tracing_span_context` stamps the active tracing span's trace/span ids onto
# emitted log records — required so logs correlate with spans without manual context plumbing.
opentelemetry-appender-tracing = { version = "0.30", features = ["experimental_use_tracing_span_context"] }
tracing = "0.1"
tracing-opentelemetry = "0.31"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
tungstenite = "0.30"

[dev-dependencies]
libc = "0.2"
parking_lot = "0.12"
toml = "0.9"
wat = "1"

[features]
# Sandbox wasm resource-profile resolvers (`agent-spec/profile_wasm`). Off by default: the
# runner binary carries no wasmtime unless a build opts in.
wasm-resolver = ["agent-spec/wasm-resolver", "st-drivers/wasm-resolver"]
# Typed Component Model resource providers. This is the sole feature that admits Wasmtime for
# observation; default members and the default st2 binary remain Wasmtime-free.
wasip2-provider-runtime = [
  "wasm-resolver",
  "dep:st2-resource-providers",
  "dep:st2-resource-wasip2",
  "st-drivers/wasip2-provider-runtime",
]
