# The root remains a package while the legacy st2 runner is present.
# Shared release identity lives in workspace.package so retiring st2 does not
# change the current binaries' release stamps.
[workspace]
members = [
  "examples/client-tui",
  "components/github-issue",
  "components/github-pr",
  "components/pty-stats",
  "components/vista",
  "crates/agent-spec",
  "crates/demo-resolver-wasm",
  "crates/smallclaims",
  "crates/st-drivers",
  "crates/st-runtime",
  "crates/st-storage-version",
  "crates/st-resource-protocol",
  "crates/st2-resource-providers",
  "crates/st2-resource-wasip2",
  "crates/st-wire",
  "crates/st3",
  "crates/st-chatgpt",
  "crates/st3-daemon",
  "crates/st3-e2e",
  "crates/st3-kernel",
  "crates/st3-telemetry",
  "crates/st3-secrets",
  "crates/st3-store",
  "crates/st3-peer",
  "crates/st3-reconcile",
  "crates/st3-api",
  "crates/st3-client",
  "crates/st3-client-codegen",
  "crates/st3-conversation-ui",
  "crates/st3-feed",
  "crates/st3-migrate",
  "crates/st3-schema",
  "crates/st3-terminal-direct",
  "crates/st3-ui-model",
  "crates/stui",
]
default-members = [
  "examples/client-tui",
  ".",
  "crates/agent-spec",
  "crates/smallclaims",
  "crates/st-drivers",
  "crates/st-runtime",
  "crates/st-resource-protocol",
  "crates/st-wire",
  "crates/st3",
  "crates/st3-daemon",
  "crates/st3-e2e",
  "crates/st3-kernel",
  "crates/st3-telemetry",
  "crates/st3-secrets",
  "crates/st3-store",
  "crates/st3-peer",
  "crates/st3-reconcile",
  "crates/st3-api",
  "crates/st3-client",
  "crates/st3-conversation-ui",
  "crates/st3-feed",
  "crates/st3-migrate",
  "crates/st3-schema",
  "crates/st3-terminal-direct",
  "crates/st3-ui-model",
  "crates/stui",
]

exclude = ["vendor/libghostty-vt-sys"]

[workspace.package]
version = "0.1.0"

[workspace.dependencies]
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }

# The published 0.2.1 crate with one build-script change so Zig 0.15.2 can link against current
# macOS SDKs; see vendor/libghostty-vt-sys/README.md.
[patch.crates-io]
libghostty-vt-sys = { path = "vendor/libghostty-vt-sys" }

# Debug assertions are OFF in the dev and test profiles and ON in release-with-assertions runs
# (docs/ci.md, "Debug assertions"): measured on the same tree, they cost about 21% of compile CPU
# and 26% of a cold compile's wall time, and about 14% of a debug-glue-heavy test's CPU (std's
# unsafe-precondition checks and debug_assert! in every crate). Overflow checks, assert! and
# bounds checks stay on. To run a build with the assertions: CARGO_PROFILE_DEV_DEBUG_ASSERTIONS=true
# CARGO_PROFILE_TEST_DEBUG_ASSERTIONS=true. The profile is part of the tree, so a signed run binds it.
[profile.dev]
debug = 1
debug-assertions = false
overflow-checks = true

[profile.dev.package."*"]
debug = 0

[profile.test]
debug = 1
debug-assertions = false
overflow-checks = true

[profile.test.package."*"]
debug = 0

# The st3-daemon library unit test is the largest rustc in the workspace; its debug info costs
# about 2 GB of peak memory and a third of its executable. Backtraces keep function names.
[profile.test.package.st3-daemon]
debug = 0

# Optimize hot third-party code in dev/test while preserving assertions (these four keep
# debug-assertions on at opt-level 3, where they are cheap) and the existing no-debug-info
# dependency policy. Workspace crates retain opt-level 0.

[profile.dev.package.libsqlite3-sys]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[profile.dev.package.sha2]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[profile.dev.package.ring]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[profile.dev.package.serde_json]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[profile.test.package.libsqlite3-sys]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[profile.test.package.sha2]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[profile.test.package.ring]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[profile.test.package.serde_json]
opt-level = 3
debug = 0
debug-assertions = true
overflow-checks = true

[package]
name = "st2"
version.workspace = true
edition = "2024"
build = "crates/st-drivers/build.rs"
description = "Harness-agnostic runner: reconcile a unified catalog+inbox folder of rendered agent specs, keep their ptys running, and deliver messages by moving inbox files."
license = "MIT"
# Every file in tests/ is a module of one test binary; see tests/integration.rs.
autotests = false

[[bin]]
name = "st2"
path = "src/main.rs"

[lib]
name = "st2"
path = "src/lib.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

# These set process-wide environment variables, so each stays a test binary of its own.
[[test]]
name = "agent_resource"
path = "tests/agent_resource.rs"

[[test]]
name = "driver_expansion"
path = "tests/driver_expansion.rs"

[[test]]
name = "event_e2e"
path = "tests/event_e2e.rs"

[[test]]
name = "resource_profile_supervisor_e2e"
path = "tests/resource_profile_supervisor_e2e.rs"

[dependencies]
# Sync by design: the runner is I/O-light (shell-outs to `pty` plus a
# folder watch + a sleep), so no tokio. Deps grow per milestone; M0 needs only parse + CLI.
agent-spec = { path = "crates/agent-spec" }
st-drivers = { path = "crates/st-drivers" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
kdl = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
st2-resource-protocol = { package = "st-resource-protocol", path = "crates/st-resource-protocol" }
st2-resource-providers = { path = "crates/st2-resource-providers", optional = true }
st2-resource-wasip2 = { path = "crates/st2-resource-wasip2", optional = true, features = ["runtime"] }
st2-wire = { package = "st-wire", path = "crates/st-wire" }
tempfile = "3"
tracing = "0.1"

[dev-dependencies]
libc = "0.2"
parking_lot = "0.12"

[features]
# Sandbox wasm resource-profile resolvers (`agent-spec/profile_wasm`). Off by default: the
# runner binary carries no wasmtime unless a build opts in.
wasm-resolver = ["agent-spec/wasm-resolver", "st-drivers/wasm-resolver"]
# Typed Component Model resource providers. This is the sole feature that admits Wasmtime for
# observation; default members and the default st2 binary remain Wasmtime-free.
wasip2-provider-runtime = [
  "wasm-resolver",
  "dep:st2-resource-providers",
  "dep:st2-resource-wasip2",
  "st-drivers/wasip2-provider-runtime",
]
