[package]
name = "st3-client-tui"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Small client built from Small Talk's reusable pieces"

[dependencies]
anyhow = "1"
crossterm = "0.29"
ratatui = { workspace = true }
st3-client = { path = "../../crates/st3-client" }
st3-feed = { path = "../../crates/st3-feed" }
st3-conversation-ui = { path = "../../crates/st3-conversation-ui", features = ["ratatui"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
serde_json = "1"
