[package]
name = "st3-conversation-ui"
version = "0.1.0"
edition = "2024"
description = "Embeddable Smalltalk native conversation rendering and pane state"
license = "MIT"

[dependencies]
ratatui = { workspace = true }
st3-client = { path = "../st3-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
unicode-width = "0.2.0"
