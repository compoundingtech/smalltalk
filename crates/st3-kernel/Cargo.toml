[package]
name = "st3-kernel"
version = "0.1.0"
edition = "2024"
description = "Claims-graph agent reconciler: the leaf modules of the st3 library, which name no store, api or reconcile code"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
st-runtime = { path = "../st-runtime" }
st3-client = { path = "../st3-client" }
st3-terminal-direct = { path = "../st3-terminal-direct" }
st3-schema = { path = "../st3-schema" }
st-drivers = { path = "../st-drivers" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tar = "0.4"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v7"] }
walkdir = "2"
