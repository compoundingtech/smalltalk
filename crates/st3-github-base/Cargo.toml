[package]
name = "st3-github-base"
version = "0.1.0"
edition = "2024"
description = "the GitHub leaf modules: authenticated transport, repository resources, watch subjects and checkouts, which name no store code"
license = "MIT"

[features]
# Forwarded by st3-daemon's feature of the same name; never enabled by a production build.
test-support = ["st3-secrets/test-support"]

[dependencies]
st3-secrets = { path = "../st3-secrets" }
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
st-runtime = { path = "../st-runtime" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
st3_github_self = { package = "st3-github-base", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
