[package]
name = "st2-resource-wasip2"
version = "0.1.0"
edition = "2024"
description = "Wasmtime Component Model executor for typed st2 resource observations."
license = "MIT"
build = "build.rs"

[dependencies]
libc = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
st2-resource-protocol = { package = "st-resource-protocol", path = "../st-resource-protocol" }
wasmtime = { version = "=48.0.1", optional = true, default-features = false, features = [
    "component-model",
    "cranelift",
    "runtime",
    "std",
] }

[dev-dependencies]
tempfile = "3"
wat = "1"

[features]
default = []
runtime = ["dep:libc", "dep:serde", "dep:sha2", "dep:wasmtime"]

[[test]]
name = "executor"
required-features = ["runtime"]
