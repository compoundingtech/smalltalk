[package]
name = "st-runtime"
version = "0.1.0"
edition = "2024"
description = "Native process and PTY runtime shared by st2 and st3"
license = "MIT"

[dependencies]
anyhow = "1"
libc = "0.2"
portable-pty = "0.9"
pty-client = { git = "https://github.com/compoundingtech/pty-rust", rev = "4f6d4daed58e1d29f0cc3c35ab8131f2fc4c323b" }
pty-core = { git = "https://github.com/compoundingtech/pty-rust", rev = "4f6d4daed58e1d29f0cc3c35ab8131f2fc4c323b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
