[package]
name = "st3"
version = "0.1.0"
edition = "2024"
description = "Claims-graph agent reconciler"
license = "MIT"
# Most tests share one binary; descriptor-limit fault injection needs its own process.
autotests = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
ciborium = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
data-encoding = "2"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
kdl = "6"
libc = "0.2"
notify = "8"
pty-client = { git = "https://github.com/compoundingtech/pty-rust", rev = "06c303f708a49a8110a5eb640194deab0561fa3a" }
pty-core = { git = "https://github.com/compoundingtech/pty-rust", rev = "06c303f708a49a8110a5eb640194deab0561fa3a" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
st-runtime = { path = "../st-runtime" }
st3-client = { path = "../st3-client" }
st3-schema = { path = "../st3-schema" }
st-drivers = { path = "../st-drivers" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
tower = { version = "0.5", features = ["util"] }
alacritty_terminal = { version = "0.26", default-features = false }
tar = "0.4"
urlencoding = "2"
uuid = { version = "1", features = ["v7"] }
walkdir = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
agent-spec = { path = "../agent-spec" }
assert_cmd = "2"
portable-pty = "0.9"
predicates = "3"
proptest = "1"

[[bin]]
name = "st3"
path = "src/main.rs"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "api_accept"
path = "tests/api_accept.rs"
