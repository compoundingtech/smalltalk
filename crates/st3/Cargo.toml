[package]
name = "st3"
version = "0.1.0"
edition = "2024"
description = "Claims-graph agent reconciler"
license = "MIT"
# Most tests share one binary; descriptor-limit fault injection needs its own process.
autotests = false

[features]
# Enabled through the self dev-dependency during tests, never by a production build.
test-support = []

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
ciborium = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
data-encoding = "2"
flate2 = "1"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
kdl = "6"
libc = "0.2"
# Exactly pty-terminal's pin: libghostty's C API is not stable between Ghostty commits.
libghostty-vt = "=0.2.1"
libghostty-vt-sys = { version = "=0.2.1", features = ["pkg-config"] }
notify = "8"
pty-client = { git = "https://github.com/compoundingtech/pty", rev = "ef0aaf96ede0ee5873ac7c659188a4cb45d1a18f" }
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "ef0aaf96ede0ee5873ac7c659188a4cb45d1a18f" }
pty-terminal = { git = "https://github.com/compoundingtech/pty", rev = "ef0aaf96ede0ee5873ac7c659188a4cb45d1a18f" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
st-runtime = { path = "../st-runtime" }
st3-client = { path = "../st3-client" }
st3-conversation-ui = { path = "../st3-conversation-ui", features = ["ratatui"] }
st3-schema = { path = "../st3-schema" }
st-drivers = { path = "../st-drivers" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
tower = { version = "0.5", features = ["util"] }
tar = "0.4"
urlencoding = "2"
uuid = { version = "1", features = ["v7"] }
walkdir = "2"

[dev-dependencies]
st3 = { path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
agent-spec = { path = "../agent-spec" }
assert_cmd = "2"
jsonschema = { version = "0.33", default-features = false }
portable-pty = "0.9"
predicates = "3"
proptest = "1"

[[bin]]
name = "st3"
path = "src/main.rs"

[[bin]]
name = "st3-fixture"
path = "src/fixture.rs"
required-features = ["test-support"]
test = false
bench = false
doc = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "api_accept"
path = "tests/api_accept.rs"
