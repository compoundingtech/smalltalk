[package]
name = "st3-api"
version = "0.1.0"
edition = "2024"
description = "the HTTP API: the daemon's routes, the client-v0 contract and the request-latency windows"
license = "MIT"

[features]
# Forwarded by st3-daemon's feature of the same name; never enabled by a production build.
test-support = ["st3-reconcile/test-support"]

[dependencies]
st3-reconcile = { path = "../st3-reconcile" }
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
kdl = "6"
libc = "0.2"
libghostty-vt = "=0.2.1"
notify = "8"
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["spec_unstable_metrics_views", "logs"] }
pty-client = { git = "https://github.com/compoundingtech/pty", rev = "f8388fe7a8617d973e720e29107e68ac5ea95987" }
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "f8388fe7a8617d973e720e29107e68ac5ea95987" }
pty-terminal = { git = "https://github.com/compoundingtech/pty", rev = "f8388fe7a8617d973e720e29107e68ac5ea95987" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
st-runtime = { path = "../st-runtime" }
st3-client = { path = "../st3-client", features = ["trace-propagation"] }
st3-ui-model = { path = "../st3-ui-model" }
st3-schema = { path = "../st3-schema" }
st-drivers = { path = "../st-drivers" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
tracing = "0.1"
tracing-opentelemetry = "0.31"
tower = { version = "0.5", features = ["util"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
st3_api_self = { package = "st3-api", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
jsonschema = { version = "0.33", default-features = false }
opentelemetry_sdk = { version = "0.30", features = ["testing"] }
proptest = "1"
