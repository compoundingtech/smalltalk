[package]
name = "st3-telemetry"
version = "0.1.0"
edition = "2024"
description = "Claims-graph agent reconciler: the telemetry modules of the st3 library (OpenTelemetry setup, command recorder, wake and startup telemetry), which name no store, api or reconcile code"
license = "MIT"

[features]
# Forwarded by st3-daemon's feature of the same name; never enabled by a production build.
test-support = []

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
hex = "0.4"
libc = "0.2"
opentelemetry = "0.30"
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["http-json", "reqwest-blocking-client", "internal-logs", "logs"] }
opentelemetry_sdk = { version = "0.30", features = ["spec_unstable_metrics_views", "logs"] }
opentelemetry-appender-tracing = { version = "0.30", features = ["experimental_use_tracing_span_context"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
st-drivers = { path = "../st-drivers" }
st3-kernel = { path = "../st3-kernel" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tracing-opentelemetry = "0.31"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
futures-util = "0.3"
opentelemetry_sdk = { version = "0.30", features = ["testing"] }
tokio = { version = "1", features = ["test-util"] }
