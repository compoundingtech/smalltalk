[package]
name = "st3-store"
version = "0.1.0"
edition = "2024"
description = "Claims-graph agent reconciler: the store, its domains and the modules they need"
license = "MIT"

[features]
# Forwarded by st3-daemon's feature of the same name; never enabled by a production build.
test-support = ["st3-telemetry/test-support", "st3-secrets/test-support", "st3-seats-base/test-support", "st3-delivery-base/test-support", "st3-missions-base/test-support", "st3-github-base/test-support", "smallclaims/test-support"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
ciborium = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
kdl = "6"
libc = "0.2"
opentelemetry = "0.30"
opentelemetry_sdk = { version = "0.30", features = ["spec_unstable_metrics_views", "logs"] }
pty-client = { git = "https://github.com/compoundingtech/pty", rev = "f8388fe7a8617d973e720e29107e68ac5ea95987" }
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "f8388fe7a8617d973e720e29107e68ac5ea95987" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
st3-kernel = { path = "../st3-kernel" }
st3-telemetry = { path = "../st3-telemetry" }
st3-secrets = { path = "../st3-secrets" }
st3-seats-base = { path = "../st3-seats-base" }
st3-delivery-base = { path = "../st3-delivery-base" }
st3-missions-base = { path = "../st3-missions-base" }
st3-github-base = { path = "../st3-github-base" }
st-runtime = { path = "../st-runtime" }
st3-client = { path = "../st3-client", features = ["trace-propagation"] }
st3-terminal-direct = { path = "../st3-terminal-direct" }
st3-ui-model = { path = "../st3-ui-model" }
st3-schema = { path = "../st3-schema" }
st-drivers = { path = "../st-drivers" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
toml = "0.9"
tracing = "0.1"
tracing-opentelemetry = "0.31"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
urlencoding = "2"
notify = "8"
walkdir = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
st3_store_self = { package = "st3-store", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
opentelemetry_sdk = { version = "0.30", features = ["testing"] }
proptest = "1"
