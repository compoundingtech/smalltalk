[package]
name = "st3-client"
version = "0.1.0"
edition = "2024"
description = "Generated typed client for the st3.client.v0 API"
license = "MIT"

[dependencies]
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "rt", "time"] }
tokio-tungstenite = "0.27"
toml = "0.9"

[dev-dependencies]
axum = "0.8"
st3 = { path = "../st3" }
tempfile = "3"
