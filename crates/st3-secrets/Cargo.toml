[package]
name = "st3-secrets"
version = "0.1.0"
edition = "2024"
description = "Claims-graph agent reconciler: the daemon client, startup status, tile registry and credential gateway (sekrets), below the store"
license = "MIT"

[features]
# Forwarded by st3-daemon's feature of the same name; never enabled by a production build.
test-support = ["st3-telemetry/test-support", "smallclaims/test-support"]

[dependencies]
st3-kernel = { path = "../st3-kernel" }
st3-telemetry = { path = "../st3-telemetry" }
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
libc = "0.2"
pty-client = { git = "https://github.com/compoundingtech/pty", rev = "f8388fe7a8617d973e720e29107e68ac5ea95987" }
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "f8388fe7a8617d973e720e29107e68ac5ea95987" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallclaims = { path = "../smallclaims" }
st3-client = { path = "../st3-client", features = ["trace-propagation"] }
st3-terminal-direct = { path = "../st3-terminal-direct" }
st-drivers = { path = "../st-drivers" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
st3_secrets_self = { package = "st3-secrets", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
