[package]
name = "st3-migrate"
version = "0.1.0"
edition = "2024"
description = "Offline st2 to st3 KDL transformer"
license = "MIT"

[dependencies]
agent-spec = { path = "../agent-spec" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
kdl = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
st3 = { path = "../st3" }
st2 = { path = "../.." }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "st3-migrate"
path = "src/main.rs"
