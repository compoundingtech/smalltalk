[package]
name = "st3-reconcile"
version = "0.1.0"
edition = "2024"
description = "the reconciler: the loop that starts, stops and watches the seats a mission declares"
license = "MIT"

[features]
# Forwarded by st3-daemon's feature of the same name; never enabled by a production build.
test-support = ["st3-peer/test-support"]

[dependencies]
st3-peer = { path = "../st3-peer" }
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
notify = "8"
opentelemetry = "0.30"
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
st-runtime = { path = "../st-runtime" }
st3-client = { path = "../st3-client", features = ["trace-propagation"] }
st3-schema = { path = "../st3-schema" }
st-drivers = { path = "../st-drivers" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
tower = { version = "0.5", features = ["util"] }
tar = "0.4"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
st3_reconcile_self = { package = "st3-reconcile", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
