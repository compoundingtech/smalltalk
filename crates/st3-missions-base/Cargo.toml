[package]
name = "st3-missions-base"
version = "0.1.0"
edition = "2024"
description = "the mission-declaration leaf modules: declaration syntax, gate parsing, provenance and the mission model, which name no store code"
license = "MIT"

[features]
# Forwarded by st3-daemon's feature of the same name; never enabled by a production build.
test-support = ["st3-secrets/test-support"]

[dependencies]
st3-secrets = { path = "../st3-secrets" }
anyhow = "1"
hex = "0.4"
kdl = "6"
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
st3-schema = { path = "../st3-schema" }

[dev-dependencies]
st3_missions_base_self = { package = "st3-missions-base", path = ".", features = ["test-support"] }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
