[package]
name = "smallclaims"
version = "0.1.0"
edition = "2024"
description = "A replicated claims graph: the claim log, its canonical order and digests, and sync between members"
license = "MIT"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ciborium = "0.2"
data-encoding = "2"
flate2 = "1"
getrandom = { version = "0.3", features = ["std"] }
hex = "0.4"
hmac = "0.12"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions", "hooks"] }
serde = { version = "1", features = ["derive"] }
# Claim bodies keep the writer's field order when they decode, so a claim hashed in insertion
# order by an old build still verifies (see `hash::claim_id_is_content_hash`). Inside smalltalk
# another dependency turns this on; the crate asks for it so it behaves the same built alone.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
toml = "0.9"
uuid = { version = "1", features = ["v7"] }

[features]
# Counters that tests of a runtime built on the graph read, such as the SQLite statements a
# thread ran. Off in every non-test build.
test-support = []

[dev-dependencies]
futures-util = "0.3"
proptest = "1"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tower = { version = "0.5", features = ["util"] }
