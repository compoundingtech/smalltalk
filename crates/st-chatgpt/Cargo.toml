[package]
name = "st-chatgpt"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["json"] }
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
libc = "0.2"
serde_json = "1"
rmcp = { version = "3.5.1", features = ["transport-streamable-http-server", "transport-io"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
