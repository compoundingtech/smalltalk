[package]
name = "st3-feed"
version = "0.1.0"
edition = "2024"
description = "Smalltalk live collection feed, reconnecting subscriptions and read-only snapshots"
license = "MIT"

[dependencies]
anyhow = "1"
st3-client = { path = "../st3-client" }
st3-conversation-ui = { path = "../st3-conversation-ui" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
uuid = { version = "1", features = ["v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
st3 = { path = "../st3" }
tempfile = "3"
