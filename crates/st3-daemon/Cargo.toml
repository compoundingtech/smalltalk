[package]
name = "st3-daemon"
version = "0.1.0"
edition = "2024"
description = "Claims-graph agent reconciler: the st3 library"
license = "MIT"

[features]
# Enabled by the st3 package for its tests and fixtures, and by the dev-dependency below for this package's
# own tests (so `cargo test -p st3-daemon --lib` runs the test-support tests, as `-p st3 --lib` did).
# Never enabled by a production build.
test-support = ["st3-telemetry/test-support"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["json", "ws"] }
base64 = "0.22"
ciborium = "0.2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "=4.6.9", features = ["unstable-dynamic"] }
flate2 = "1"
futures-util = "0.3"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
# `--attach` converts and scales images before upload (see src/attach_image.rs).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
kdl = "6"
libc = "0.2"
# Exactly pty-terminal's pin: libghostty's C API is not stable between Ghostty commits.
libghostty-vt = "=0.2.1"
libghostty-vt-sys = { version = "=0.2.1", features = ["pkg-config"] }
notify = "8"
opentelemetry = "0.30"
opentelemetry-otlp = { version = "0.30", default-features = false, features = ["http-json", "reqwest-blocking-client", "internal-logs", "logs"] }
opentelemetry_sdk = { version = "0.30", features = ["spec_unstable_metrics_views", "logs"] }
opentelemetry-appender-tracing = { version = "0.30", features = ["experimental_use_tracing_span_context"] }
pty-client = { git = "https://github.com/compoundingtech/pty", rev = "f8388fe7a8617d973e720e29107e68ac5ea95987" }
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "f8388fe7a8617d973e720e29107e68ac5ea95987" }
pty-terminal = { git = "https://github.com/compoundingtech/pty", rev = "f8388fe7a8617d973e720e29107e68ac5ea95987" }
resvg = "0.48"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled", "trace", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
smallclaims = { path = "../smallclaims" }
st3-kernel = { path = "../st3-kernel" }
st3-telemetry = { path = "../st3-telemetry" }
st-runtime = { path = "../st-runtime" }
st3-client = { path = "../st3-client", features = ["trace-propagation"] }
st3-terminal-direct = { path = "../st3-terminal-direct" }
st3-ui-model = { path = "../st3-ui-model" }
st3-schema = { path = "../st3-schema" }
st-drivers = { path = "../st-drivers" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.27"
toml = "0.9"
tracing = "0.1"
tracing-opentelemetry = "0.31"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "env-filter", "fmt", "registry", "std"] }
tower = { version = "0.5", features = ["util"] }
tar = "0.4"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "v7"] }
walkdir = "2"

[dev-dependencies]
data-encoding = "2"
alacritty_terminal = { version = "0.26", default-features = false }
smallclaims = { path = "../smallclaims", features = ["test-support"] }
st3_daemon_self = { package = "st3-daemon", path = ".", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
agent-spec = { path = "../agent-spec" }
assert_cmd = "2"
jsonschema = { version = "0.33", default-features = false }
opentelemetry_sdk = { version = "0.30", features = ["testing"] }
portable-pty = "0.9"
predicates = "3"
proptest = "1"
