[package]
name = "stui"
version = "0.1.0"
edition = "2024"
description = "Smalltalk terminal UI starter shell"
license = "MIT"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
st3-client = { path = "../st3-client" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v7"] }
signal-hook = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml = "0.9"
libc = "0.2"

[[bin]]
name = "stui"
path = "src/main.rs"
