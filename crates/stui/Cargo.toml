[package]
name = "stui"
version = "0.1.0"
edition = "2024"
description = "Smalltalk terminal UI library"
license = "MIT"
# The workspace's build identity stamp, shared with st2 and st-drivers (see src/version.rs).
build = "../../build.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
crossterm = "0.29"
ratatui = { workspace = true }
smallclaims = { path = "../smallclaims" }
st3-client = { path = "../st3-client" }
st3-terminal-direct = { path = "../st3-terminal-direct" }
st3-feed = { path = "../st3-feed" }
st3-conversation-ui = { path = "../st3-conversation-ui", features = ["ratatui"] }
st3-ui-model = { path = "../st3-ui-model" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v7"] }
signal-hook = "0.3"
serde_json = "1"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
toml = "0.9"
libc = "0.2"
base64 = "0.22"
flate2 = "1"
unicode-width = "0.2.0"
reqwest = { version = "0.12", default-features = false }
# Thumbnails of attached images: kitty placeholders, sixel or iTerm2, else half blocks.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Agent terminals attached through their PTY session (the gateway's raw stream), drawn here.
alacritty_terminal = { version = "0.26", default-features = false }
pty-client = { git = "https://github.com/compoundingtech/pty", rev = "1ae8c187301034d2b343b6ec638f2b74c009f92e" }
pty-terminal = { git = "https://github.com/compoundingtech/pty", rev = "1ae8c187301034d2b343b6ec638f2b74c009f92e" }
pty-core = { git = "https://github.com/compoundingtech/pty", rev = "1ae8c187301034d2b343b6ec638f2b74c009f92e" }

# Its own tests run with the crate's, so the timing log it writes stays valid JSON.
[[example]]
name = "phone_client"
test = true

[dev-dependencies]
st3 = { path = "../st3" }
tempfile = "3"
axum = { version = "0.8", features = ["ws"] }
portable-pty = "0.9"
